<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CariocAce Copilot">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>CariocAce Copilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Concept : salon privé. Noir pur, verre fumé, filets de lumière, ivoire et platine pour tout ce qui est actif.
   Titres, chiffres du relevé et valeurs des cartes en Sora (sans-serif géométrique large, repli San Francisco sur iPhone),
   textes en Instrument Sans, petites capitales espacées pour les libellés. Aucune couleur d'accent : seules les couleurs des cartes (jeu à quatre couleurs) et les alertes en portent.
   Toujours sombre, quel que soit le réglage du téléphone. */
:root{
  --bg:#050506; --band:rgba(5,5,6,.72); --sheet:rgba(16,16,18,.88);
  --glow-1:rgba(255,255,255,.075); --glow-2:rgba(255,255,255,.04); --glow-3:rgba(150,160,185,.07);
  --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.075); --glass-3:rgba(255,255,255,.13);
  --edge:rgba(255,255,255,.09); --edge-hi:rgba(255,255,255,.17);
  --field:rgba(0,0,0,.45); --shadow:0 14px 44px rgba(0,0,0,.6);
  --fg:#F2F0EB; --fg-2:#A09D96; --fg-3:#66635E;
  --acc-1:#FFFFFF; --acc-2:#CFCBC3; --on-acc:#0B0B0C; --acc-ink:#E9E6DF;
  --acc-glow:rgba(255,255,255,.20); --acc-wash:rgba(255,255,255,.10);
  --ok:#86D1A8; --warn:#F0A06A; --bad:#F28B82; --del:#B3302A; --on-del:#FFFFFF;
  --card-face:#F8F6F1; --card-face-2:#DEDAD1; --card-edge:rgba(0,0,0,.22);
  --spade:#0E0E10; --heart:#C4283A; --diamond:#2456C6; --club:#1C7B45;
  --f-disp:'Sora','SF Pro Display',-apple-system,system-ui,'Segoe UI',sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --blur:blur(20px) saturate(140%);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(75% 38% at 12% 0%,var(--glow-1),transparent 70%),
    radial-gradient(55% 34% at 100% 52%,var(--glow-3),transparent 72%),
    radial-gradient(80% 40% at 60% 104%,var(--glow-2),transparent 72%)}
.wrap{max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc-ink);outline-offset:2px}
h1,h2,h3{margin:0}
::placeholder{color:var(--fg-3);opacity:1}

/* floating header */
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;max-width:640px;margin:8px auto 0;padding:12px;
  border:1px solid var(--edge);border-radius:26px;background:var(--glass-2);box-shadow:var(--shadow),inset 0 1px 0 var(--edge-hi);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 6px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
h1{font:700 18px/1 var(--f-disp);letter-spacing:-.025em;white-space:nowrap}
h1 span{font-weight:400;color:var(--fg-2)}
.led{display:block;width:7px;height:7px;border-radius:50%;background:var(--fg-3);flex:none}
.led.db{background:var(--fg);box-shadow:0 0 10px rgba(255,255,255,.7)}
.led.local{background:var(--warn);box-shadow:0 0 10px rgba(240,160,106,.6)}
.stat{font:500 12px var(--f-body);font-variant-numeric:tabular-nums;color:var(--fg-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--field);border:1px solid var(--edge)}
.seg button{flex:1;min-width:0;min-height:38px;border:0;background:transparent;border-radius:999px;font:600 13.5px var(--f-body);color:var(--fg-2);padding:0 8px}
.seg button.on{background:var(--glass-3);color:var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 1px 0 var(--edge-hi)}
.seg .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--acc-1);margin-left:7px;vertical-align:middle;box-shadow:0 0 8px rgba(255,255,255,.7)}

/* glass panels */
.sec{position:relative;margin-top:14px;padding:18px 16px;border:1px solid var(--edge);border-radius:28px;background:linear-gradient(180deg,var(--glass-2),var(--glass) 40%);
  box-shadow:var(--shadow),inset 0 1px 0 var(--edge-hi);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  display:flex;flex-direction:column;gap:16px}
.sec.plain{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:4px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h .lbl{font:600 17px/1.15 var(--f-disp);letter-spacing:-.015em;text-transform:none;color:var(--fg)}
.lbl{font:600 10.5px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.fld{display:flex;flex-direction:column;gap:9px;min-width:0}
.hint{font-size:13px;color:var(--fg-2)}
.link{border:0;background:none;color:var(--fg);font:600 13px var(--f-body);min-height:36px;padding:0 4px;text-decoration:underline;text-underline-offset:3px}
.link.bad{color:var(--bad)}
.banner{margin-top:14px;padding:11px 14px;border:1px solid var(--warn);border-radius:18px;background:var(--glass);color:var(--warn);font-size:13px;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

/* controls */
.chip{min-height:40px;min-width:44px;padding:0 15px;border-radius:999px;border:1px solid var(--edge);background:var(--glass-2);color:var(--fg);
  font:500 14px var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;box-shadow:inset 0 1px 0 var(--edge-hi)}
.chip:active{background:var(--glass-3)}
.chip.on{background:linear-gradient(180deg,var(--acc-1),var(--acc-2));border-color:transparent;color:var(--on-acc);font-weight:600;
  box-shadow:0 6px 22px var(--acc-glow),inset 0 1px 0 #fff}
.chip:disabled{opacity:.3;cursor:not-allowed}
.chip.mono{font:500 14px var(--f-body);font-variant-numeric:tabular-nums}
.chip .sub{font:500 11px var(--f-body);font-variant-numeric:tabular-nums;opacity:.7}
.chip.stack{flex-direction:column;gap:0;min-height:50px;line-height:1.15;border-radius:18px}
.inp{height:46px;min-width:0;width:100%;padding:0 14px;border:1px solid var(--edge);border-radius:16px;background:var(--field);color:var(--fg);
  font:16px var(--f-body);box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.inp.num{font-variant-numeric:tabular-nums}
.inp.sm{width:86px;flex:none}
textarea.inp{height:auto;min-height:100px;padding:12px 14px;resize:vertical;line-height:1.4;border-radius:18px}
.stackrow{display:flex;gap:8px;align-items:center}
.scroll-row{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.scroll-row::-webkit-scrollbar{display:none}
.scroll-row .chip.on{box-shadow:0 0 0 1px rgba(255,255,255,.22),inset 0 1px 0 #fff}
.btn{min-height:48px;padding:0 24px;border-radius:999px;border:0;background:linear-gradient(180deg,var(--acc-1),var(--acc-2));color:var(--on-acc);
  font:700 15px var(--f-body);flex:none;box-shadow:0 8px 26px var(--acc-glow),inset 0 1px 0 #fff}
.btn:disabled{opacity:.3;box-shadow:none}
.btn.ghost{background:var(--glass-2);color:var(--fg);border:1px solid var(--edge);font-weight:600;box-shadow:inset 0 1px 0 var(--edge-hi)}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad);box-shadow:none}

/* playing cards (four-colour deck) */
.cards{display:flex;gap:10px;flex-wrap:wrap}
.card{width:56px;height:78px;border-radius:12px;border:1px solid var(--card-edge);background:linear-gradient(165deg,var(--card-face),var(--card-face-2));
  box-shadow:0 8px 20px rgba(0,0,0,.28),inset 0 1px 0 #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;color:var(--spade);line-height:1;flex:none}
.card .r{font:600 26px/1 var(--f-disp);letter-spacing:-.045em}
.card .s{font:400 22px/1 var(--f-body);margin-top:5px}
.card.s-s{color:var(--spade)} .card.s-h{color:var(--heart)} .card.s-d{color:var(--diamond)} .card.s-c{color:var(--club)}
.card .q{color:var(--warn)}
.card.empty{background:var(--glass);border:1.5px dashed var(--fg-3);color:var(--fg-2);box-shadow:none}
.card.empty .r{font:300 28px/1 var(--f-body)}
.card.partial{border:2px solid var(--warn);box-shadow:0 0 0 4px rgba(255,160,102,.16),0 8px 20px rgba(0,0,0,.28)}
.card.act{outline:2px solid var(--acc-ink);outline-offset:3px}
.card.mini{width:30px;height:42px;border-radius:8px;display:inline-flex;box-shadow:0 4px 10px rgba(0,0,0,.22),inset 0 1px 0 #fff}
.card.mini .r{font-size:15px}
.card.mini .s{font-size:11px;margin-top:2px}
.card.mini.empty{box-shadow:none}
.card.big{width:64px;height:90px;border-radius:14px}
.card.big .r{font-size:32px}
.card.big .s{font-size:26px}

/* HUD readout and action feed */
.pot{font:500 12.5px var(--f-body);font-variant-numeric:tabular-nums;color:var(--fg-2)}
.pot b{color:var(--fg);font-weight:700}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hud>div{min-width:0;display:flex;flex-direction:column;gap:5px;padding:11px 12px;border:1px solid var(--edge);border-radius:18px;background:var(--glass-2);box-shadow:inset 0 1px 0 var(--edge-hi)}
.hud .k{font:600 10px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.hud .v{font:600 24px/1.05 var(--f-disp);letter-spacing:-.04em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hud .v small{font:500 11px var(--f-body);letter-spacing:0;color:var(--fg-2);margin-left:3px}
.hud .v.sm{font-size:16px;letter-spacing:-.02em;padding-top:5px}
.hud .sub{font:500 11px var(--f-body);font-variant-numeric:tabular-nums;color:var(--fg-3)}
ol.log{list-style:none;margin:0;padding:0;border-radius:20px;background:var(--field);border:1px solid var(--edge);overflow:hidden}
ol.log li{display:flex;align-items:center;gap:10px;padding:2px 4px 2px 12px;min-height:48px;border-top:1px solid var(--edge)}
ol.log li:first-child{border-top:0}
.who{font:700 10.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--glass-2);border:1px solid var(--edge);flex:none}
.who.hero{background:var(--acc-wash);color:var(--acc-ink);border-color:var(--acc-glow)}
.what{flex:1;min-width:0;font:500 14px var(--f-body);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.after{font:500 11.5px var(--f-body);font-variant-numeric:tabular-nums;color:var(--fg-2);white-space:nowrap}
.x{width:40px;height:40px;border:0;background:transparent;color:var(--fg-3);font-size:22px;line-height:1;flex:none}
.sheet.det .x{width:44px;height:44px}
.sheet.det .x.armed{width:auto;min-width:44px;height:44px}
.x.armed{width:auto;padding:0 12px;border-radius:999px;font:700 12px var(--f-body);color:var(--bad);border:1px solid var(--bad);background:rgba(242,139,130,.12)}
ol.log li.gone .who,ol.log li.gone .what,ol.log li.gone .after{opacity:.38;text-decoration:line-through}
.delwarn{margin:0}
/* start screen: two blocks, a switch in the header, the name as a way back */
.brand-btn{background:none;border:0;padding:12px 0;margin:-12px 0;font:inherit;letter-spacing:inherit;color:inherit;text-align:left;white-space:nowrap}
.seg.mini{padding:3px;gap:2px;flex:none}
.seg.mini button{flex:none;min-height:32px;padding:0 13px;font-size:12.5px}
#tabs[hidden],#blocks[hidden]{display:none}
.top-row{flex-wrap:wrap}
.stat-row{order:3;flex-basis:100%;display:flex;gap:12px;justify-content:space-between;align-items:baseline;min-width:0}
.stat-row[hidden]{display:none}
.stat:empty{display:none}
.stat-row .stat:first-child{flex:1 1 0;min-width:0}
.stat.note{flex:0 1 auto;max-width:72%;text-align:right}
.stat.note.warn{color:var(--warn)}
#view-home[hidden]{display:none}
#view-home{min-height:calc(100vh - 170px);min-height:calc(100svh - 170px);display:flex;flex-direction:column;justify-content:center}
body.home .wrap>div[aria-hidden]{height:0!important}
.hb-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.hb{position:relative;display:flex;flex-direction:column;justify-content:flex-start;min-height:380px;padding:18px 16px 20px;border-radius:30px;text-align:left;color:var(--fg);overflow:hidden;
  border:1px solid var(--edge);background:radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.15),transparent 62%),linear-gradient(180deg,var(--glass-2),var(--glass));
  box-shadow:var(--shadow),inset 0 1px 0 var(--edge-hi);transition:transform .15s ease,background .15s ease}
.hb:active{transform:scale(.985);background:radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.22),transparent 62%),linear-gradient(180deg,var(--glass-3),var(--glass-2))}
.hb-hd{display:flex;justify-content:space-between;align-items:center}
.hb-go{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--edge);background:var(--glass-2);color:var(--fg-2)}
.hb-go svg{width:15px;height:15px}
.hb-ic{align-self:center;margin-top:50px;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:var(--acc-ink);border:1px solid var(--edge-hi);
  background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.22),rgba(255,255,255,.03) 72%);box-shadow:0 0 46px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.35)}
.hb-ic svg{width:44px;height:44px}
.hb-txt{display:block;margin-top:50px}
.hb-n{display:block;font:700 42px/1 var(--f-disp);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.hb-u{display:block;font:500 13.5px var(--f-body);color:var(--fg-2);margin-top:6px}
.hb-s{display:block;font:500 12.5px var(--f-body);color:var(--fg-3);margin-top:3px}
.builder{display:flex;flex-direction:column;gap:12px;padding-top:2px}
.dock .builder{gap:5px;padding-top:0}
.vill{display:flex;flex-direction:column;gap:14px;padding:16px 14px;border:1px solid var(--edge);border-radius:22px;background:var(--glass-2);box-shadow:inset 0 1px 0 var(--edge-hi)}

/* hands list */
.grp-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px;padding:24px 6px 10px}
.grp-a{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grp-ask{flex:0 0 100%;font:500 13px/1.4 var(--f-body);color:var(--fg-2)}
.grp-h h3{font:600 18px/1.15 var(--f-disp);letter-spacing:-.02em}
.grp-h .meta{font:500 12px var(--f-body);font-variant-numeric:tabular-nums;color:var(--fg-2);white-space:nowrap}
.hand{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px;background:var(--glass);border:1px solid var(--edge);border-radius:22px;margin-bottom:10px;
  box-shadow:inset 0 1px 0 var(--edge-hi);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.hand-cards{display:flex;gap:5px;flex:none}
.hand-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.hand-sum{font:600 14px/1.3 var(--f-body)}
.hand-sum .no{font:600 11.5px var(--f-body);font-variant-numeric:tabular-nums;color:var(--fg-2);margin-right:8px}
.hand-board{display:flex;gap:5px;flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;font:500 11.5px var(--f-body);padding:3px 10px;border-radius:999px;background:var(--glass-2);border:1px solid var(--edge);color:var(--fg-2)}
.tag.warn{background:transparent;border-color:var(--warn);color:var(--warn)}
.res-won{color:var(--ok)} .res-lost{color:var(--bad)} .res-split{color:var(--fg-2)}
.star{color:var(--fg)}
.empty-state{padding:48px 8px;text-align:center;color:var(--fg-2)}
.swipe{position:relative;margin-bottom:10px;border-radius:22px;overflow:hidden}
.swipe .hand{position:relative;margin-bottom:0;touch-action:pan-y}
.swipe .hand:focus-visible{outline-offset:-3px}
.swipe-del{position:absolute;top:0;right:0;bottom:0;width:96px;border:0;background:var(--del);color:var(--on-del);font:600 14px var(--f-body);visibility:hidden}
.swipe.sw .swipe-del{visibility:visible}
.tag.ver-good{background:transparent;border-color:rgba(134,209,168,.5);color:var(--ok)}
.tag.ver-bad{background:transparent;border-color:rgba(242,139,130,.5);color:var(--bad)}
.chip.vgood.on{background:rgba(134,209,168,.16);border-color:var(--ok);color:var(--ok);box-shadow:none}
.chip.vbad.on{background:rgba(242,139,130,.16);border-color:var(--bad);color:var(--bad);box-shadow:none}

/* review: summary tiles, per-tournament rows, one-hand-at-a-time card */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:7px;padding:13px 14px;border:1px solid var(--edge);border-radius:20px;background:var(--glass-2);box-shadow:inset 0 1px 0 var(--edge-hi)}
.tile .k{font:600 10px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.tile .v{font:600 30px/1 var(--f-disp);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.tile.good .v{color:var(--ok)} .tile.bad .v{color:var(--bad)}
.rbar{display:flex;gap:3px;height:8px;border-radius:999px;overflow:hidden;background:var(--field)}
.rbar.thin{height:5px}
.rbar i{display:block;height:100%;min-width:0}
.rbar .g{background:var(--ok)} .rbar .b{background:var(--bad)}
.rate{font:500 14px var(--f-body);color:var(--fg-2)}
.rate b{font:600 22px var(--f-disp);letter-spacing:-.03em;color:var(--fg);margin-right:4px}
.trn{display:flex;flex-direction:column}
.trn-r{display:flex;flex-direction:column;gap:9px;padding:14px 2px;border-top:1px solid var(--edge)}
.trn-r:first-child{border-top:0;padding-top:2px}
.trn-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.trn-n{font:600 16px/1.2 var(--f-disp);letter-spacing:-.02em;min-width:0;overflow-wrap:anywhere}
.trn-h .meta{font:500 12px var(--f-body);color:var(--fg-2);white-space:nowrap}
.trn-c{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font:600 14px var(--f-body);font-variant-numeric:tabular-nums}
.trn-c .good{color:var(--ok)} .trn-c .bad{color:var(--bad)} .trn-c .pend{color:var(--fg-2);font-weight:500}
.trn-c .rt{margin-left:auto}
.rv-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.prog{height:4px;border-radius:999px;background:var(--field);overflow:hidden}
.prog i{display:block;height:100%;border-radius:inherit;background:var(--fg)}
.rv-cards{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

/* review on a computer (wide screens only: the body gets .wide-rv): suivi + tournaments on the left, the hand and two big buttons on the right */

/* entering a hand on a computer (wide screens only: the body gets .wide-ed): the header on one line, the table large on the left, the panel on the right */
body.wide-ed .wrap,body.wide-ed .top{max-width:1240px}
body.wide-ed .top{flex-direction:row;align-items:center;justify-content:space-between;gap:20px;padding:10px 14px}

body.wide-ed .stage>.dock{grid-column:2;grid-row:1/4;height:auto}

/* floating save bar, sheet, toast */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.savebar-in{pointer-events:auto;max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center;padding:8px 8px 8px 20px;border-radius:999px;
  border:1px solid var(--edge-hi);background:var(--sheet);box-shadow:var(--shadow),inset 0 1px 0 var(--edge-hi);-webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%)}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88%;overflow:auto;background:var(--sheet);border:1px solid var(--edge);border-bottom:0;border-radius:30px 30px 0 0;
  box-shadow:0 -20px 60px rgba(0,0,0,.4),inset 0 1px 0 var(--edge-hi);-webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--fg-3);opacity:.55;margin:0 auto 14px}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ranks{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.ranks .chip{min-height:52px;min-width:0;padding:0;border-radius:16px;font:600 19px var(--f-disp);letter-spacing:-.04em}
.ranks .chip.clear{font:600 12.5px var(--f-body);letter-spacing:0}
.suits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.suits .chip{min-height:66px;min-width:0;padding:0;border-radius:20px;font:400 36px var(--f-body);background:linear-gradient(165deg,var(--card-face),var(--card-face-2));border:1px solid var(--card-edge);box-shadow:0 6px 16px rgba(0,0,0,.25),inset 0 1px 0 #fff}
.suits .chip.on{outline:3px solid var(--acc-ink);outline-offset:2px;box-shadow:0 0 24px var(--acc-glow),inset 0 1px 0 #fff}
.suits .s-s{color:var(--spade)} .suits .s-h{color:var(--heart)} .suits .s-d{color:var(--diamond)} .suits .s-c{color:var(--club)}
textarea.view{min-height:220px;font:12.5px/1.5 var(--f-mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;padding:11px 18px;border-radius:999px;
  background:var(--sheet);color:var(--fg);border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 var(--edge-hi);font:500 14px var(--f-body);
  max-width:calc(100% - 32px);text-align:center;pointer-events:none;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}


/* save confirmation */
.done{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;pointer-events:none}
.done[hidden]{display:none}
.done-card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 36px 22px;border-radius:34px;border:1px solid var(--edge-hi);background:var(--sheet);
  box-shadow:0 30px 80px rgba(0,0,0,.65),inset 0 1px 0 var(--edge-hi);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%)}
.done-ring{width:78px;height:78px;border-radius:50%;background:linear-gradient(180deg,var(--acc-1),var(--acc-2));display:grid;place-items:center;
  box-shadow:0 10px 40px var(--acc-glow),inset 0 1px 0 #fff}
.done-ring svg{width:40px;height:40px;display:block}
.done-ring path{fill:none;stroke:var(--on-acc);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.done-txt{font:600 16px/1.2 var(--f-disp);letter-spacing:-.02em;text-align:center}
.done-sub{font:500 12.5px var(--f-body);color:var(--fg-2);margin-top:-6px;text-align:center}

@media (prefers-reduced-motion:no-preference){
  .done.show .done-card{animation:done-in .34s cubic-bezier(.2,.9,.3,1.25) both}
  .done.show .done-ring{animation:done-ring .8s ease-out both}
  .done-ring path{stroke-dasharray:24;stroke-dashoffset:24}
  .done.show .done-ring path{animation:done-draw .4s .16s ease-out forwards}
  .done.out .done-card{animation:done-out .26s ease-in forwards}
  @keyframes done-in{from{opacity:0;transform:scale(.82) translateY(14px)}to{opacity:1;transform:none}}
  @keyframes done-out{to{opacity:0;transform:scale(.96) translateY(-8px)}}
  @keyframes done-draw{to{stroke-dashoffset:0}}
  @keyframes done-ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45),0 10px 40px var(--acc-glow),inset 0 1px 0 #fff}100%{box-shadow:0 0 0 30px rgba(255,255,255,0),0 10px 40px var(--acc-glow),inset 0 1px 0 #fff}}
  #view-edit.enter>.sec{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
  #view-edit.enter>.sec:nth-child(2){animation-delay:.06s}
  #view-edit.enter>.sec:nth-child(3){animation-delay:.12s}
  #view-edit.enter>.sec:nth-child(4){animation-delay:.18s}
  #view-edit.enter>.sec:nth-child(n+5){animation-delay:.24s}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  .sheet{animation:sheet-up .2s ease-out}
  @keyframes sheet-up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
  .led.db,.led.local{animation:led 2.8s ease-in-out infinite}
  @keyframes led{50%{opacity:.45}}
  .swipe .hand{transition:transform .2s ease}
  .chip,.btn{transition:background .15s ease,box-shadow .15s ease}
}

.ai-row{padding:0 4px}
@media (prefers-reduced-motion:reduce){.rd-busy{animation:none}}
/* Suivi: list of tournaments, form, bullets stepper, backup nudge */
.tl{list-style:none;margin:0;padding:0;border-radius:20px;background:var(--field);border:1px solid var(--edge);overflow:hidden}
.tl li+li{border-top:1px solid var(--edge)}
.tr{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:10px 14px;border:0;background:transparent;text-align:left;color:var(--fg)}
.tr:active{background:var(--glass-2)}
.tr-d{flex:none;width:40px;text-align:center;font:600 10.5px/1.1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.tr-d b{display:block;font:700 19px/1.1 var(--f-disp);letter-spacing:-.02em;color:var(--fg)}
.tr-m{flex:1;min-width:0}
.tr-m b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font:600 15px/1.25 var(--f-body);overflow-wrap:anywhere}
.tr-s{display:block;margin-top:2px;font:500 12.5px/1.3 var(--f-body);color:var(--fg-2);font-variant-numeric:tabular-nums}
.tr-r{flex:none;display:flex;align-items:center}
.tr-n{font:700 15px var(--f-disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tr-b{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tr-b i{font:700 9px/1 var(--f-body);font-style:normal;letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;border-radius:999px;border:1px solid var(--edge-hi);color:var(--acc-ink);background:var(--acc-wash);white-space:nowrap}
.step{display:flex;align-items:center;justify-content:space-between;height:46px;padding:0 4px;border:1px solid var(--edge);border-radius:16px;background:var(--field);box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.step button{width:52px;height:38px;border:0;border-radius:12px;background:transparent;color:var(--fg);font:500 24px/1 var(--f-body)}
.step button:active{background:var(--glass-2)}
.step output{font:700 18px var(--f-disp);font-variant-numeric:tabular-nums}
.hint.err{color:var(--bad)}
.bk{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:12px 14px;border:1px solid var(--edge);border-radius:20px;background:var(--glass);font:500 13px/1.35 var(--f-body);color:var(--fg-2)}
.bk .btn{min-height:40px;padding:0 16px;font-size:13.5px}
.tr-mn{display:block;width:100%;margin:-4px 0 0;padding:2px 14px 12px 66px;border:0;background:transparent;text-align:left;color:var(--acc-ink);font:600 12.5px var(--f-body)}
.tr-mn:active{opacity:.6}
.hud.two{grid-template-columns:1fr 1fr}
.dh{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;padding:16px 18px;border:1px solid var(--edge);border-radius:22px;background:var(--glass-2);box-shadow:inset 0 1px 0 var(--edge-hi)}
.dh .k{font:600 10px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.dh-v{font:600 40px/1.05 var(--f-disp);letter-spacing:-.045em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.dh-v small{margin-left:7px;font:500 15px var(--f-body);letter-spacing:0;color:var(--fg-2)}
.dh .sub{font:500 12.5px/1.35 var(--f-body);font-variant-numeric:tabular-nums;color:var(--fg-3)}
.kvs{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
.kvs>div{display:flex;flex-direction:column;gap:4px;min-width:0;padding:12px 0;border-top:1px solid var(--edge)}
.kvs>div:nth-child(-n+2){border-top:0;padding-top:2px}
.kvs .k{font:600 10px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.kvs b{font:600 20px/1.15 var(--f-disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kvs b small{margin-left:4px;font:500 11px var(--f-body);letter-spacing:0;color:var(--fg-2)}
.kvs i{font:500 11.5px/1.3 var(--f-body);font-style:normal;color:var(--fg-3);overflow-wrap:anywhere}
.kvs .wide{grid-column:1/-1}
.kvs .neg .k{min-height:24px}
.cv{position:relative;height:176px;border-radius:20px;background:var(--field);border:1px solid var(--edge);overflow:hidden;touch-action:pan-y;cursor:crosshair}
.cv-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cv-z{stroke:var(--edge-hi);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.cv-a{fill:var(--fg);fill-opacity:.07;stroke:none}
.cv-l{fill:none;stroke:var(--fg);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cv-y{position:absolute;left:10px;transform:translateY(-50%);font:600 10.5px var(--f-body);color:var(--fg-3);font-variant-numeric:tabular-nums;pointer-events:none}
.cv-g{position:absolute;top:0;bottom:0;width:1px;background:var(--edge-hi);pointer-events:none}
.cv-g[hidden]{display:none}
.cv-d{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 4px rgba(255,255,255,.12);pointer-events:none}
.cv-m{position:relative;height:16px;margin-top:6px}
.cv-m span{position:absolute;transform:translateX(-50%);font:600 10px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);white-space:nowrap}
.cv-r{margin:8px 0 0;min-height:34px;font-variant-numeric:tabular-nums}
.cv-r b{color:var(--fg)}
.mo{list-style:none;margin:0;padding:0}
.mo li{border-top:1px solid var(--edge)}
.mo li:first-child{border-top:0}
.mo-h{display:grid;grid-template-columns:62px 1fr auto 16px;align-items:center;gap:12px;width:100%;min-height:56px;padding:9px 0;border:0;background:transparent;color:var(--fg);text-align:left}
.mo-h:active{opacity:.7}
.mo-ch{width:16px;height:16px;color:var(--fg-3);transition:transform .2s}
.mo-h[aria-expanded=true] .mo-ch{transform:rotate(90deg)}
.mo-c{padding:2px 0 14px}
.mo-c[hidden]{display:none}
.mo-l b{display:block;font:600 14px var(--f-body)}
.mo-l i{font:500 11.5px var(--f-body);font-style:normal;color:var(--fg-3)}
.mo-b{height:8px;border-radius:999px;background:var(--field);overflow:hidden}
.mo-b u{display:block;height:100%;border-radius:999px;text-decoration:none;opacity:.9}
.mo-b u.won{background:var(--ok)}
.mo-b u.lost{background:var(--bad)}
.tlnk{border:0;background:transparent;padding:6px 0 6px 12px;color:var(--acc-ink);font:600 12.5px var(--f-body)}
.mo-n{min-width:68px;text-align:right;font:700 14px var(--f-disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
/* tournament still being played, mental space, debrief form */
.ld{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--acc-1);box-shadow:0 0 10px rgba(255,255,255,.7);vertical-align:middle}
.chip .ld{margin-right:0}
.live .lv{list-style:none;margin:0;padding:0}
.lv-i{padding:12px 0;border-top:1px solid var(--edge)}
.lv-i:first-child{border-top:0;padding-top:2px}
.lv-h b{display:block;font:600 16px/1.25 var(--f-body);overflow-wrap:anywhere}
.live .row{margin:10px 0 0;align-items:center;flex-wrap:wrap}
.lv-i:last-child{padding-bottom:0}
.sw{margin-top:8px}
.tr-s em{font-style:normal;font-weight:700;color:var(--fg)}
.tr-note{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin-top:4px;font:500 12.5px/1.35 var(--f-body);color:var(--fg-3);overflow-wrap:anywhere}
.mcs{display:grid;gap:8px}
.mc{padding:14px 16px;border:1px solid var(--edge);border-radius:20px;background:var(--glass-2);box-shadow:inset 0 1px 0 var(--edge-hi)}
.mc-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mc-t .k{font:600 10px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.mc-v{font:600 28px/1 var(--f-disp);letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.mc-v small{margin-left:3px;font:500 12px var(--f-body);letter-spacing:0;color:var(--fg-2)}
.mc-bar{height:6px;margin:10px 0 8px;border-radius:999px;background:var(--field);overflow:hidden}
.mc-bar u{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--acc-2),var(--acc-1));text-decoration:none}
.mc-s{display:flex;align-items:center;gap:12px;font:500 12px var(--f-body);color:var(--fg-3)}
.mc-s span{flex:none;white-space:nowrap}
.mc-sp{flex:1;min-width:0;height:30px}
.mc-sp polyline{fill:none;stroke:var(--fg);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.8}
.dbh{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:0 4px 0 0;border:0;border-top:1px solid var(--edge);background:transparent;color:var(--fg);font:600 15px var(--f-body);text-align:left}
.dbh i{margin-left:8px;font-style:normal;font-weight:500;font-size:12.5px;color:var(--fg-3)}
.dbh[aria-expanded=true] .mo-ch{transform:rotate(90deg)}
.sc{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sc-b{min-height:46px;padding:0;border-radius:14px;border:1px solid var(--edge);background:var(--field);color:var(--fg);font:600 17px var(--f-disp);font-variant-numeric:tabular-nums}
.sc-b:active{background:var(--glass-3)}
.sc-b.on{background:linear-gradient(180deg,var(--acc-1),var(--acc-2));border-color:transparent;color:var(--on-acc)}
.sc-x{color:var(--fg-3);font:500 20px var(--f-body)}
.sc-v{margin-left:6px;font-style:normal;font-weight:500;letter-spacing:0;text-transform:none;color:var(--fg-3)}
.sr{list-style:none;margin:0;padding:0}
.sr-i{border-top:1px solid var(--edge)}
.sr-i:first-child{border-top:0}
.sr-b{display:block;width:100%;padding:12px 0;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.sr-b:active{background:var(--glass-3)}
.sr-h{display:flex;align-items:center;gap:10px}
.sr-h b{flex:1;min-width:0}
.sr-ch{flex:none;width:16px;height:16px;color:var(--fg-3)}
.sr-h b{font:600 16px/1.25 var(--f-body);overflow-wrap:anywhere}
.sr-h b em{margin-left:4px;font-style:normal;font-weight:500;color:var(--fg-3)}
.sr-v{font:600 16px var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.sr + .row .tlnk{padding-left:0}
.sr-s{display:block;margin-top:3px;font:500 12.5px/1.4 var(--f-body);color:var(--fg-3)}
/* tournament form in a sheet over the page, undo bar, glow on what was just touched */
html.sheet-open,html.sheet-open body{overflow:hidden}
.scrim{touch-action:none;overscroll-behavior:contain}
.sheet:focus{outline:none}
.sheet.tsheet{display:flex;flex-direction:column;overflow:hidden;max-height:92%;padding-bottom:0;overscroll-behavior:contain}
.tsheet .sheet-in{flex:1;min-height:0;width:100%;gap:12px}
.tsheet .sheet-h .lbl{font:600 17px/1.15 var(--f-disp);letter-spacing:-.015em;text-transform:none;color:var(--fg)}
.ts-b{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:16px;padding:2px 2px 16px}
.ts-f{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--edge)}
.ts-f .btn:not(.sm){flex:1;min-width:140px}
.ts-f .hint{flex:0 0 100%;margin:0}
.ts-f .tlnk{margin-left:auto;padding:10px 0 10px 12px}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px;width:max-content;padding:6px 6px 6px 20px}
.toast.act[hidden]{display:none}
.t-undo{flex:none;min-height:44px;padding:0 18px;border:1px solid var(--edge-hi);border-radius:999px;background:var(--glass-3);color:var(--fg);font:600 14px var(--f-body);box-shadow:inset 0 1px 0 var(--edge-hi)}
.t-undo:active{background:var(--glass-2)}
.dr .lv{list-style:none;margin:0;padding:0}
.dr .row{margin:10px 0 0;align-items:center;flex-wrap:wrap}
.dr .pot{color:var(--fg-3)}
.sr-b{padding:12px 10px;margin:0 -10px;width:calc(100% + 20px);border-radius:14px}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{background-color:rgba(255,255,255,.12)}100%{background-color:rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;background-color:rgba(255,255,255,.12)}}

/* bottom bar : Suivi · + · Mains (compact : 58 px, bouton + 46 px légèrement surélevé) */
:root{--nav-h:58px;--nav-plus:46px;--nav-lift:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:19;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav[hidden]{display:none}
.nav-in{pointer-events:auto;max-width:400px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:1fr calc(var(--nav-plus) + 22px) 1fr;align-items:center;padding:0 8px;border-radius:30px;
  border:1px solid var(--edge-hi);background:var(--sheet);box-shadow:var(--shadow),inset 0 1px 0 var(--edge-hi);-webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%)}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:46px;min-width:0;margin:0 4px;border:0;background:transparent;border-radius:22px;color:var(--fg-2);font:600 10.5px/1 var(--f-body);letter-spacing:.01em;transition:color .15s,background-color .15s}
.nv svg{width:21px;height:21px;display:block}
.nv.on{color:var(--fg);background:var(--glass-2)}
.nv:active{background:var(--glass-2)}
.nv-plus{justify-self:center;align-self:center;width:var(--nav-plus);height:var(--nav-plus);transform:translateY(calc(var(--nav-lift) * -1));border-radius:50%;display:grid;place-items:center;color:var(--on-acc);
  border:1px solid rgba(255,255,255,.6);background:linear-gradient(180deg,var(--acc-1),var(--acc-2));
  box-shadow:0 0 0 4px rgba(5,5,6,.78),0 8px 22px rgba(0,0,0,.55),0 0 20px var(--acc-glow),inset 0 1px 0 #fff;transition:transform .12s}
.nv-plus svg{width:22px;height:22px;display:block}
.nv-plus:active{transform:translateY(calc(var(--nav-lift) * -1)) scale(.93)}
.endsp{height:160px}
/* the bars stack: Enregistrer / Mauvais-Bon sit just above the bottom bar */
html.has-nav{--navh:calc(var(--nav-h) + 8px + env(safe-area-inset-bottom,0px))}
html.has-nav .endsp{height:calc(160px + var(--navh))}
html.has-nav .savebar{bottom:calc(var(--navh) + 10px);padding-bottom:6px}
html.has-nav .toast{bottom:calc(var(--navh) + 18px)}
html.has-nav.has-sb .toast{bottom:calc(var(--navh) + 98px)}

/* chevrons: what can be opened says so */
.tr-c,.hand-ch{flex:none;width:16px;height:16px;color:var(--fg-3)}
.tr-c{margin-left:-4px}
.hand-ch{align-self:center;margin-left:-4px}
/* the card of a tournament */
.sheet.tcsheet{display:flex;flex-direction:column;overflow:hidden;max-height:92%;padding-bottom:0;overscroll-behavior:contain}
.tcsheet:focus{outline:none}
.tcsheet .sheet-in{flex:1;min-height:0;width:100%;gap:12px}
.tcsheet .sheet-h .lbl{font:600 17px/1.15 var(--f-disp);letter-spacing:-.015em;text-transform:none;color:var(--fg);overflow-wrap:anywhere}
.tc-b{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px;padding:2px 2px 16px}
.tc-b .dh{margin-bottom:0}
.tc-d{margin:0;font:500 13px/1.35 var(--f-body);color:var(--fg-2)}
.tc-d::first-letter{text-transform:uppercase}
.tc-b .tr-b{margin-top:0}
.tc-m{display:flex;flex-direction:column;gap:8px}
.tc-m .mc-bar{margin-bottom:0}
.tc-db{padding:14px 16px;border:1px solid var(--edge);border-radius:20px;background:var(--glass-2);box-shadow:inset 0 1px 0 var(--edge-hi)}
.tc-db .k{font:600 10px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.tc-db p{margin:8px 0 0;font:400 14.5px/1.45 var(--f-body);white-space:pre-wrap;overflow-wrap:anywhere}
/* a screen that opens fades in, a touch */
@media (prefers-reduced-motion:no-preference){
  .vin{animation:vin .2s ease-out}
  @keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}

/* backup nudge: at the top of a list it sits close to the page edge */
#hl-top>.bk,#view-suivi>.bk{margin:0 0 4px}
#view-suivi>.bk{margin-top:14px}

/* ===== search fields (hands, tournaments) ===== */
.srch{position:relative;display:flex;align-items:center}
.srch>svg{position:absolute;left:14px;width:18px;height:18px;color:var(--fg-3);pointer-events:none}
.srch .inp{padding-left:42px;padding-right:46px}
.srch-x{position:absolute;right:0;top:0;width:46px;height:46px;border:0;background:transparent;color:var(--fg-3);font:400 24px/1 var(--f-disp);display:grid;place-items:center;border-radius:16px}
.srch-x[hidden]{display:none}
.srch-n{margin:0}
.srch-n[hidden]{display:none}
.tl-y{margin:14px 4px 6px;font:600 12px/1 var(--f-disp);letter-spacing:.08em;color:var(--fg-3)}
.tl-y:first-child{margin-top:4px}
#tq-res[hidden],#t-dash[hidden],#t-hd[hidden]{display:none}
#t-hd{display:flex;flex-direction:column;gap:inherit}

/* ===== live tournament pill in the header ===== */
.livepill{order:1;display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:max(96px,calc(100% - 196px));height:34px;margin:-2px 0;padding:0 14px;border:1px solid var(--edge-hi);border-radius:999px;background:var(--glass-3);color:var(--fg);font:600 13px/1 var(--f-body);position:relative}
.livepill[hidden]{display:none}
.livepill::before{content:"";position:absolute;inset:-6px -4px}
.livepill .ld{margin:0;flex:none}
.livepill span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== touch targets: 44 px at least on a phone / touch screen ===== */
@media (pointer:coarse),(max-width:760px){
  .chip{min-height:44px}
  .btn.sm,.bk .btn,.fx-add{min-height:44px}
  .link,.pc-links{min-height:44px}
  .tlnk{display:inline-flex;align-items:center;min-height:44px;padding:0 0 0 12px}
  .tlnk[hidden]{display:none}
  .seg button{min-height:44px}
  .step{height:54px}
  .step button{height:44px}
  .brand-btn{padding:13px 0;margin:-13px 0}
  .camb{width:44px;height:44px}
}

/* the save bar comes in softly when the first thing is noted */
@media (prefers-reduced-motion:no-preference){
  .savebar:not([hidden]) .savebar-in{animation:sbIn .28s cubic-bezier(.2,.8,.2,1) both}
  @keyframes sbIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}

/* small magnifier next to a section title: opens its search field */
.sec-h.sh-s{align-items:center;flex-wrap:nowrap}
.sh-ic{flex:none;position:relative;width:36px;height:36px;margin:-8px -8px -8px 0;padding:0;border:0;border-radius:50%;background:transparent;color:var(--fg-2);display:grid;place-items:center}
.sh-ic svg{width:20px;height:20px}
.sh-ic::before{content:"";position:absolute;inset:-4px}
.sh-ic.on{background:var(--glass-3);color:var(--fg);box-shadow:inset 0 1px 0 var(--edge-hi)}
#tq-box[hidden]{display:none}

/* a stored hand is open: the ✕ of the save bar */
/* table of the hand (Saisir): graphite felt, rim in cold white platinum; seats are moved by transform only */
:root{--tbl-rim:#E4EBF5;--tbl-glow:rgba(200,216,242,.55)}
.tsec .seg button{padding:0 6px;white-space:nowrap}
.tbl{position:relative;width:100%;max-width:420px;margin:4px auto 2px;aspect-ratio:100/106;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.tbl.rot{touch-action:pan-y;cursor:grab}
.tbl.rot:active{cursor:grabbing}
.tbl-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
/* the table: a graphite stadium, a raised rail around a dark felt (the sizes come from tblPlace) */
.t-sh{fill:#000;opacity:.6}
.t-rail{fill:url(#tbl-rail)}
.t-spec{fill:none;stroke:url(#tbl-spec)}
.t-rim{fill:none;stroke:url(#tbl-rim);stroke-width:1.5}
.t-band{fill:url(#tbl-band);stroke:rgba(0,0,0,.85);stroke-width:1.2}
.t-lip{fill:none;stroke:url(#tbl-lip);stroke-width:1}
.t-felt{fill:url(#tbl-fg);stroke:rgba(255,255,255,.085);stroke-width:1}
.t-gl{fill:url(#tbl-gl)}

  background:rgba(8,8,10,.94);border:1px solid rgba(255,255,255,.16);box-shadow:0 4px 10px rgba(0,0,0,.5);font:600 calc(11px*var(--ss,1))/1 var(--f-body);color:var(--fg-2);white-space:nowrap;pointer-events:none}

.seat.edl .sl{left:12px;transform:none}

.seat .dbtn{position:absolute;top:calc(-5px*var(--ss,1));right:calc(-5px*var(--ss,1));width:calc(18px*var(--ss,1));height:calc(18px*var(--ss,1));border-radius:50%;background:radial-gradient(circle at 50% 30%,#ffffff,#e6e9ef 58%,#b9c1cc);color:#0b0c0e;font:800 calc(10px*var(--ss,1))/calc(18px*var(--ss,1)) var(--f-body);text-align:center;font-style:normal;box-shadow:0 0 0 1.5px rgba(0,0,0,.5),0 2px 5px rgba(0,0,0,.6)}

/* ===== helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => {
  if (typeof v === 'number') return v;

};

const clone = o => JSON.parse(JSON.stringify(o));
const pad2 = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const fmtDate = s => {
  try {

/* ===== cards ("As" = ace of spades; "A?" or "?s" = incomplete) ===== */
const isFull = c => !!c && c[0] !== '?' && c[1] !== '?';

function cardsOf(h, g) {
  if (g === 'hero') return h.hero.cards;
  if (h.board[g]) return h.board[g];
  const v = h.villains.find(x => x.id === g);
  return v ? v.cards : null;
}
function usedCards(h, except) {
  const set = new Set();
  const add = (g, i, c) => { if (isFull(c) && !(except && except.group === g && except.i === i)) set.add(c); };
  h.hero.cards.forEach((c, i) => add('hero', i, c));
  ['flop','turn','river'].forEach(g => h.board[g].forEach((c, i) => add(g, i, c)));
  h.villains.forEach(v => v.cards.forEach((c, i) => add(v.id, i, c)));
  return set;
}
function cardFace(c, extra) {
  if (!c) return '';
  const rq = c[0] === '?', sq = c[1] === '?';
  const cls = 'card' + (sq ? '' : ' s-' + c[1]) + (rq || sq ? ' partial' : '') + (extra ? ' ' + extra : '');
  return '<span class="' + cls + '"><span class="r' + (rq ? ' q' : '') + '">' + (rq ? '?' : rankLabel(c[0])) +
    '</span><span class="s' + (sq ? ' q' : '') + '">' + (sq ? '?' : GLYPH[c[1]]) + '</span></span>';
}
function slotBtn(group, i, c, active) {
  let cls = 'card', inner;
  if (!c) { cls += ' empty'; inner = '<span class="r">+</span>'; }
  else {
    const rq = c[0] === '?', sq = c[1] === '?';
    cls += (sq ? '' : ' s-' + c[1]) + (rq || sq ? ' partial' : '');
    inner = '<span class="r' + (rq ? ' q' : '') + '">' + (rq ? '?' : rankLabel(c[0])) + '</span><span class="s' + (sq ? ' q' : '') + '">' + (sq ? '?' : GLYPH[c[1]]) + '</span>';
  }
  const label = c ? 'Carte ' + (i + 1) + ' : ' + (c[0] === '?' ? 'valeur manquante' : rankLabel(c[0])) + (c[1] === '?' ? ', couleur manquante' : ' de ' + SUIT_FR[c[1]]) : 'Choisir la carte ' + (i + 1);
  return '<button type="button" class="' + cls + (active ? ' act' : '') + '" data-act="pick" data-g="' + esc(group) + '" data-i="' + i + '" aria-label="' + esc(label) + '">' + inner + '</button>';
}

/* ===== hand model ===== */
function newHand(ctx) {
  ctx = ctx || {};
  return {
    id: null, createdAt: null, handNo: null,
    tournament: ctx.tournament || '', date: ctx.date || todayStr(),
    table: ctx.table || '9', ante: ctx.ante == null ? 0 : ctx.ante,
    hero: { pos: '', stack: '', cards: [null, null] },
    villains: [{ id: 'V1', pos: '', stack: '', cards: [null, null], read: '' }], nextV: 2,
    board: { flop: [null, null, null], turn: [null], river: [null] },
    streets: { preflop: [], flop: [], turn: [], river: [] },
    result: '', phase: '', tags: [], note: '', verdict: '', reviewedAt: null, comment: '', photo: ''
  };
}
function normHand(x) {
  const h = newHand({});
  Object.keys(x).forEach(k => { if (k in h || k === 'id' || k === 'createdAt' || k === 'updatedAt' || k === 'handNo') h[k] = x[k]; });
  const xh = x.hero || {};
  h.hero = { pos: xh.pos || '', stack: xh.stack == null ? '' : xh.stack, cards: [0, 1].map(i => (xh.cards && xh.cards[i]) || null) };
  h.villains = (x.villains || []).map(v => ({
    id: v.id, pos: v.pos || '', stack: v.stack == null ? '' : v.stack, read: v.read || '',
    cards: [0, 1].map(i => (v.cards && v.cards[i]) || null)
  }));
  const xb = x.board || {};
  h.board = {
    flop: [0, 1, 2].map(i => (xb.flop && xb.flop[i]) || null),
    turn: [(xb.turn && xb.turn[0]) || null],
    river: [(xb.river && xb.river[0]) || null]
  };
  h.streets = {};
  STREETS.forEach(s => { h.streets[s] = (x.streets && x.streets[s]) ? x.streets[s] : []; });
  h.tags = x.tags || [];
  if (h.verdict !== 'good' && h.verdict !== 'bad') { h.verdict = ''; h.reviewedAt = null; }
  if (typeof h.comment !== 'string') h.comment = '';
  if (typeof h.photo !== 'string') h.photo = '';
  if (!TABLES[h.table]) h.table = '9';
  const maxV = h.villains.reduce((m, v) => Math.max(m, parseInt(String(v.id).slice(1), 10) || 0), 0);
  h.nextV = Math.max(h.nextV || 1, maxV + 1);
  return h;
}
const isPristine = h => !h.hero.pos && !h.hero.stack && h.hero.cards.every(c => !c) &&
  h.villains.every(v => !v.pos && !v.stack && v.cards.every(c => !c) && !v.read) &&
  STREETS.every(s => !h.streets[s].length) && ['flop','turn','river'].every(g => h.board[g].every(c => !c)) &&
  !h.result && !h.phase && !h.tags.length && !h.note && !h.verdict && !h.comment && !h.photo;

/* ===== storage: account database when available, otherwise this device ===== */
const store = { mode: 'init', hands: [], ready: false, slow: false, error: '', col: null, persist: true };

function readLocal() { try { return JSON.parse(localStorage.getItem(LS_HANDS) || '[]') || []; } catch (e) { return []; } }
function writeLocal(arr) { try { localStorage.setItem(LS_HANDS, JSON.stringify(arr)); store.persist = true; } catch (e) { store.persist = false; } }

async function initStore() {
  let db = null, user = null, uid = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const r = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      db = r[0]; user = r[1];
      if (user) uid = await user.id();
    }
  } catch (e) { /* fall back to local */ }
  if (db && uid) {
    store.mode = 'db';
    store.col = db.doc('data/users/' + uid + '/profile').collection('hands');
    const timer = setTimeout(() => { if (!store.ready) { store.slow = true; onStoreChange(); } }, 10000);
    store.col.onSnapshot(snap => {
      store.hands = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
      if (!snap.metadata.fromCache) { clearTimeout(timer); store.slow = false; }
      store.ready = true; store.error = '';

    }, err => {
      clearTimeout(timer);
      store.error = (err && err.code) || 'unavailable'; store.ready = true;

    store.mode = 'local'; store.hands = readLocal(); store.ready = true;
    onStoreChange();

}
async function storeSave(h) {
  if (store.mode === 'db') { await store.col.doc(h.id).set(h); return; }
  const arr = store.hands.filter(x => x.id !== h.id); arr.push(h);
  store.hands = arr; writeLocal(arr); onStoreChange();
}
async function storeRemove(id) {
  if (store.mode === 'db') { await store.col.doc(id).delete(); return; }
  store.hands = store.hands.filter(x => x.id !== id); writeLocal(store.hands); onStoreChange();
}
const sortedHands = () => store.hands.slice().sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
async function storeRemoveMany(ids) {
  if (store.mode === 'db') { await Promise.all(ids.map(id => store.col.doc(id).delete())); return; }
  const gone = new Set(ids);
  store.hands = store.hands.filter(x => !gone.has(x.id)); writeLocal(store.hands); onStoreChange();
}

/* ===== tournaments =====
   Hands of one tournament, entered one after the other, form one group. The calendar date alone never splits it:
   a tournament that runs past midnight stays whole (same name, date at most a day apart, entered within 12 h).
   Inside a group the hands are numbered 1, 2, 3... in the order they were entered. */
const normName = s => String(s == null ? '' : s).trim().replace(/\s+/g, ' ').toLowerCase();   /* "ksop  Main Event " = "KSOP Main Event" */
const SESSION_GAP = 12 * 3600 * 1000;
const dayNum = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || '')); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000 : NaN; };
const stamp = h => { const t = Date.parse(h.createdAt || ''); return Number.isFinite(t) ? t : 0; };
const byEntry = (a, b) => stamp(a) - stamp(b) || String(a.id || '').localeCompare(String(b.id || ''));
function joinsGroup(g, h) {
  const name = (h.tournament || '').trim();
  if (g.name !== name) return false;
  if (h.date >= g.start && h.date <= g.end) return true;   /* same day: always the same tournament */
  if (!name) return false;                                  /* unnamed hands are only grouped per day */
  const d = dayNum(h.date), a = dayNum(g.start), b = dayNum(g.end), t = stamp(h);
  return d >= a - 1 && d <= b + 1 && (!t || !g.last || Math.abs(t - g.last) <= SESSION_GAP);
}
function tournamentGroups(hands) {
  const groups = [];
  hands.slice().sort(byEntry).forEach(h => {
    let g = null;
    for (let i = groups.length - 1; i >= 0 && !g; i--) if (joinsGroup(groups[i], h)) g = groups[i];
    if (!g) { g = { name: (h.tournament || '').trim(), start: h.date, end: h.date, last: 0, hands: [] }; groups.push(g); }
    g.hands.push(h);
    if (h.date < g.start) g.start = h.date;
    if (h.date > g.end) g.end = h.date;
    g.last = Math.max(g.last, stamp(h));
  });
  return groups;   /* oldest group first, oldest hand first */
}
const findGroup = id => tournamentGroups(store.hands).find(g => g.hands.some(h => h.id === id));
/* id -> { no: number inside its tournament, date: the tournament's first date } */
function groupInfo() {
  const info = {};
  tournamentGroups(store.hands).forEach(g => g.hands.forEach((h, i) => { info[h.id] = { no: i + 1, date: g.start }; }));
  return info;
}
function nextHandNo(h) {
  const cand = Object.assign({}, h, { id: '~new', createdAt: photoTime(h) || new Date().toISOString() });
  const g = tournamentGroups(store.hands.concat([cand])).find(x => x.hands.indexOf(cand) >= 0);
  return g ? g.hands.indexOf(cand) + 1 : 1;
}
/* the next hand carries on with the same tournament when the last one is from today or was entered less than 12 h ago */
const continuing = last => !!last && (last.date === todayStr() || (stamp(last) > 0 && Date.now() - stamp(last) < SESSION_GAP));

/* ===== review: after GTO Wizard, every hand gets a verdict, "good" or "bad" ===== */
function reviewStats(hands) {
  const s = { total: hands.length, good: 0, bad: 0, pending: 0 };
  hands.forEach(h => { if (h.verdict === 'good') s.good++; else if (h.verdict === 'bad') s.bad++; else s.pending++; });
  return s;
}
const goodRate = s => (s.good + s.bad) ? Math.round(100 * s.good / (s.good + s.bad)) : null;
/* hands waiting for a verdict, in the order they were entered */
const toReview = () => store.hands.filter(h => !h.verdict).sort(byEntry);
/* the comment on a hand: a correction when it was bad, anything he wants to keep when it was good */
async function setComment(id, text) {
  const h = store.hands.find(x => x.id === id);
  if (!h) return null;
  const t = String(text == null ? '' : text).trim().slice(0, 1000);
  if ((h.comment || '') === t) return t;
  const n = normHand(clone(h));
  n.comment = t; n.updatedAt = new Date().toISOString();
  await storeSave(n);
  return t;
}
async function setVerdict(id, v) {
  const h = store.hands.find(x => x.id === id);
  if (!h) return;
  const n = normHand(clone(h)), now = new Date().toISOString();
  n.verdict = (v === 'good' || v === 'bad') ? v : '';
  n.reviewedAt = n.verdict ? now : null;
  n.updatedAt = now;
  await storeSave(n);
}

/* ===== photos (this device only) =====
   A snapshot of the board taken at the table, kept only until the hand it belongs to is saved complete.
   The pictures live in IndexedDB, reduced to JPEG; photoMeta is the in-memory list. A photo that no hand and no
   open entry points to is "waiting": it sits in the strip at the top of Saisir until it is used or deleted.
   Photos never go into the .json backup. */
const PHOTO_EDGE = 2000, PHOTO_Q = 0.82;
let photoMeta = [], photoDbP = null;
const photoUrls = {};
const clockOf = ms => new Date(ms).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
const dayOf = ms => { const d = new Date(ms); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const stripPhoto = h => { const c = Object.assign({}, h); delete c.photo; return c; };
function photoDb() {
  if (!photoDbP) photoDbP = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('carnet-photos', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('p', { keyPath: 'id' }); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error || new Error('idb'));
      r.onblocked = () => rej(new Error('idb blocked'));
    } catch (e) { rej(e); }
  });
  return photoDbP;
}
function photoOp(mode, fn) {
  return photoDb().then(db => new Promise((res, rej) => {
    const t = db.transaction('p', mode); let req;
    try { req = fn(t.objectStore('p')); } catch (e) { rej(e); return; }
    t.oncomplete = () => res(req ? req.result : undefined);
    t.onerror = t.onabort = () => rej(t.error || new Error('idb'));
  }));
}
const photoPut = rec => photoOp('readwrite', s => s.put(rec));
const photoGet = id => photoOp('readonly', s => s.get(id));
const photoAll = () => photoOp('readonly', s => s.getAll());
const photoDelRec = id => photoOp('readwrite', s => s.delete(id));
const photoOk = id => !!id && photoMeta.some(m => m.id === id);
async function photoInit() {
  try { photoMeta = (await photoAll()).map(r => ({ id: r.id, t: r.t || 0, ct: r.ct || 0, w: r.w || 0, h: r.h || 0, sig: r.sig || '' })); }
  catch (e) { photoMeta = []; }
  if (H && H.photo && !photoOk(H.photo)) {   /* the picture is gone (cleared storage): do not keep pointing at it */
    H.photo = '';
    if (editingId) { try { const o = JSON.parse(origJson); o.photo = ''; origJson = JSON.stringify(o); } catch (e) { /* no baseline */ } }
  }
  onPhotosChange();
}
/* ids pointed to by a saved hand or by the entry being typed */
function photoRefs() {
  const s = new Set(store.hands.map(h => h.photo).filter(Boolean));
  if (H && H.photo) s.add(H.photo);
  return s;
}
const photosWaiting = () => { const r = photoRefs(); return photoMeta.filter(m => !r.has(m.id)).sort((a, b) => a.t - b.t); };
/* when a hand has a photo with a trustworthy capture time, that is when the hand was played */
const photoTime = h => { const m = h && h.photo ? photoMeta.find(x => x.id === h.photo) : null; return m && m.ct ? new Date(m.ct).toISOString() : null; };
function photoUrl(id) {
  if (!id) return '';
  const u = photoUrls[id];
  if (u) return u;
  if (u === undefined) {
    photoUrls[id] = '';
    photoGet(id).then(r => {
      if (!r || !r.blob) return;
      photoUrls[id] = URL.createObjectURL(r.blob);
      document.querySelectorAll('img[data-photo="' + id + '"]').forEach(im => { im.src = photoUrls[id]; im.classList.remove('wait'); });
    }).catch(() => { /* the picture is gone: the placeholder stays */ });
  }
  return '';
}
function photoImg(id, cls, alt) {
  const u = photoUrl(id);
  return '<img class="' + (cls || '') + (u ? '' : ' wait') + '" data-photo="' + esc(id) + '" alt="' + esc(alt || '') + '"' + (u ? ' src="' + u + '"' : '') + '>';
}
function photoRemove(id) {
  if (!id) return Promise.resolve();
  photoMeta = photoMeta.filter(m => m.id !== id);
  if (photoUrls[id]) { try { URL.revokeObjectURL(photoUrls[id]); } catch (e) { /* ignore */ } }
  delete photoUrls[id];
  return photoDelRec(id).catch(() => { /* nothing more to do */ });
}
async function shrinkPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url;
    await img.decode();   /* the browser applies the camera's rotation itself */
    const k = Math.min(1, PHOTO_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', PHOTO_Q));
    return { blob: blob, w: w, h: h };
  } finally { URL.revokeObjectURL(url); }
}
async function addPhotos(files) {
  const list = Array.from(files || []).filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|heic|heif|webp)$/i.test(f.name || ''));
  if (!list.length) { toast('Aucune image reconnue'); return; }
  try { await photoDb(); } catch (e) { toast('Photos indisponibles sur cet appareil'); return; }
  list.sort((a, b) => (a.lastModified || 0) - (b.lastModified || 0));   /* playing order; ties keep the picking order */
  const now = Date.now();
  let ok = 0, dup = 0, bad = 0;
  for (let i = 0; i < list.length; i++) {
    const f = list[i], sig = (f.name || '') + '|' + f.size + '|' + f.lastModified;
    if (photoMeta.some(m => m.sig === sig)) { dup++; continue; }
    if (list.length > 1) toast('Photo ' + (i + 1) + ' sur ' + list.length + '…');
    try {
      const s = await shrinkPhoto(f);
      const t = f.lastModified || now;
      const ct = (t < now - 120000 && t > now - 400 * 86400000) ? t : 0;   /* a capture time only when it is plausible */
      const rec = { id: 'p' + now.toString(36) + i + Math.random().toString(36).slice(2, 6), blob: s.blob, w: s.w, h: s.h, t: t, ct: ct, sig: sig, added: now };
      await photoPut(rec);
      photoMeta.push({ id: rec.id, t: t, ct: ct, w: s.w, h: s.h, sig: sig });
      ok++;
    } catch (e) { bad++; }
  }
  const bits = [];
  if (ok) bits.push(ok + ' photo' + (ok > 1 ? 's ajoutées' : ' ajoutée'));
  if (dup) bits.push(dup + ' déjà présente' + (dup > 1 ? 's' : ''));
  if (bad) bits.push(bad + ' illisible' + (bad > 1 ? 's' : ''));
  toast(bits.join(' · '));
  const typingName = document.activeElement && document.activeElement.id === 'in-tourn';
  if (ok && ui.block === 'mains' && ui.tab === 'edit' && !ui.bil && !typingName) ui.det = true;   /* the photos wait in the details: show them (not over the Bilan, nor while the name is typed: the dot on « Détails » says they wait) */
  onPhotosChange();
}

/* ===== state ===== */
let H = null;
let editingId = null;
/* a computer screen (or a tablet held wide): the review gets its own two-column layout */
const WIDE_Q = window.matchMedia ? window.matchMedia('(min-width: 1000px)') : null;
const isWide = () => !!(WIDE_Q && WIDE_Q.matches);
/* ===== reading the board with Claude (optional) =====
   Needs the person's own API key, typed in the app and kept on this device until "Oublier la clé".
   The key is never part of a hand, a draft or the .json backup. The photo is sent to the Claude API only when a read is asked for.
   The answer is a proposal: nothing is written into the hand until it is confirmed, and a card Claude is not sure of is left empty.
   (Sonnet 5.5 refuses a forced tool call: the tool is offered with tool_choice left on auto, and the prompt asks for the call.) */
const LS_KEY = 'carnet-claude-key', LS_USE = 'carnet-claude-use';
const AI_URL = 'https://api.anthropic.com/v1/messages', AI_MODEL = 'claude-sonnet-5-5';

/* Is the betting round finished? 'open' = someone still has to act, 'closed' = go to the next street, 'over' = only one player left.

  const able = live.filter(a => !S.allin[a.id]);

  if (able.length === 0) return 'closed';
  if (able.length === 1) return owes(able[0]) ? 'open' : 'closed';

/* Who may still act in this betting round: everyone still holding chips who has not acted since the last raise, or who still owes chips.
