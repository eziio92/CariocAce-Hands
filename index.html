  return '<div class="stackrow"><input class="inp num sm" id="in-' + kind + id + '" inputmode="decimal" placeholder="bb" value="' + esc(val) +
    '" data-in="' + kind + '" data-id="' + id + '" aria-label="Stack en bb" autocomplete="off">' +
    '<div class="scroll-row">' + STACKS.map(s => chip(s, { on: n === s, cls: 'mono', attrs: 'data-act="' + kind + '" data-id="' + id + '" data-v="' + s + '"' })).join('') + '</div></div>';
}

/* photos: the one tied to this hand, then the ones still waiting to be used */
function secPhotos() {
  let out = '';
  if (photoOk(H.photo)) {
    out += '<div class="sec ph"><div class="sec-h"><span class="lbl">Photo du board</span><button type="button" class="link" data-act="phdetach">Remettre de côté</button></div>' +
      '<button type="button" class="ph-i" data-act="phview" data-id="' + esc(H.photo) + '" data-from="panel" aria-label="Agrandir la photo">' + photoImg(H.photo, '', 'Photo du board') + '<span class="ph-z">Agrandir</span></button>' +
      '<p class="hint" style="margin:0">Elle disparaît dès que la main est enregistrée complète.</p></div>';
  }
  const q = photosWaiting();
  if (q.length) {
    out += '<div class="sec pq"><div class="sec-h"><span class="lbl">Photos à traiter</span><span class="pot">' + q.length + '</span></div>' +
      '<div class="scroll-row">' + q.map((m, i) => '<button type="button" class="pq-t" data-act="phview" data-id="' + esc(m.id) + '" data-from="queue" aria-label="Photo ' + (i + 1) + '">' +
        photoImg(m.id, '', 'Photo ' + (i + 1)) + '<span class="pq-n">' + (m.ct ? clockOf(m.ct) : (i + 1)) + '</span></button>').join('') + '</div>' +
      (H.photo ? '' : '<p class="hint" style="margin:0">Touche une photo, puis « Utiliser pour la main en cours ».</p>') + '</div>';
  }
  return out;
}

/* the camera: one touch from the table (photos of the board wait in the details) */
function camBtn() {
  return '<button type="button" class="camb" data-act="photoadd" aria-label="Ajouter des photos du board" title="Ajouter des photos du board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1.1-1.6A1.5 1.5 0 0 1 10 3.8h4a1.5 1.5 0 0 1 1.2.6L16.3 6h1.2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.3"/></svg></button>';
}

/* the date and the ante (the name of the tournament is in the bar over the table) */
function secContext() {
  const no = editingId ? ((groupInfo()[editingId] || {}).no || H.handNo || '') : nextHandNo(H);
  return '<div class="sec"><div class="sec-h"><span class="lbl">Date et ante</span><span class="sec-r"><span class="pot">' + (editingId ? 'Modification · ' : '') + 'main n°<b>' + esc(no) + '</b></span>' +
    '</span></div>' +
    '<div class="datebox"><span class="dt" id="date-txt">' + esc(dateLbl(H.date)) + '</span>' +
      '<svg class="dt-ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>' +
      '<input type="date" id="in-date" value="' + esc(H.date) + '" data-in="date" aria-label="Date"></div>' +
    fld('Ante','<div class="row">' + chip('Aucune', { on: !(num(H.ante) > 0), attrs: 'data-act="ante" data-v="0"' }) + chip('BBA 1 bb', { on: num(H.ante) === 1, attrs: 'data-act="ante" data-v="1"' }) +
      '<input class="inp num sm" id="in-ante" inputmode="decimal" placeholder="autre" value="' + (num(H.ante) > 0 && num(H.ante) !== 1 ? esc(H.ante) : '') + '" data-in="ante" aria-label="Ante totale en bb" autocomplete="off"></div>') +
    '</div>';
}

/* ===== the tournament of the hand: a bar over the table, the first thing to fill (never required) =====
   Typed, or one touch on a name under it: the tournaments of the Suivi (the one being played first), then the names of the hands already noted.
   The list is the whole one when the field is entered; it narrows once something is typed. */
function tbNames(q) {
  const seen = new Set(), out = [];
  const add = (n, live) => { const k = normName(n); if (k && !seen.has(k)) { seen.add(k); out.push({ n: String(n).trim(), live: live }); } };
  tSorted(tStore.list).sort((a, b) => (b.live === true) - (a.live === true)).forEach(t => add(t.name, t.live === true));
  sortedHands().forEach(h => add(h.tournament, false));
  const k = normName(q);
  return (k ? out.filter(o => { const m = normName(o.n); return m !== k && m.indexOf(k) >= 0; }) : out).slice(0, 6);
}
function tbarHtml() {
  const v = H.tournament || '';
  return '<div class="tbar' + (v.trim() ? '' : ' empty') + '" id="tbar"><label class="tb-f" for="in-tourn"><span class="lbl">Tournoi</span>' +
    '<input id="in-tourn" placeholder="Nom du tournoi" value="' + esc(v) + '" data-in="tourn" autocomplete="off" autocapitalize="words" enterkeyhint="done" aria-label="Nom du tournoi">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></label>' +
    '<div class="tb-sug" id="tb-sug"></div></div>';
}
/* open: the names under the bar (ui.tbQ = what was typed since the field was entered, null = nothing yet) */
function tbSync(open) {
  const bar = $('#tbar'), sug = $('#tb-sug');
  if (!bar || !sug) return;
  bar.classList.toggle('empty', !(H.tournament || '').trim());
  if (!open) { bar.classList.remove('open'); return; }
  sug.innerHTML = tbNames(ui.tbQ).map(o => chip((o.live ? '<i class="ld" aria-hidden="true"></i>' : '') + esc(o.n),
    { on: normName(H.tournament) === normName(o.n), attrs: 'data-act="pickt" data-v="' + esc(o.n) + '" data-keepfocus' })).join('');
  bar.classList.add('open');
}

/* ===== the panel under the table (one screen, nothing to scroll): seats · action · result ===== */

/* Betting round finished: no more actions to add. Offer the next street, or the result. */
function dockClosed(sim, st) {
  const state = streetState(sim, st), i = STREETS.indexOf(st), nx = STREETS[i + 1];
  const why = state === 'over' ? 'Il ne reste qu\'un joueur.' : 'Tout le monde a parlé.';
  const next = state === 'over' || !nx
    ? '<button type="button" class="btn sm" data-act="dock" data-v="end">Résultat</button>'
    : '<button type="button" class="btn ghost sm" data-act="street" data-v="' + nx + '">Passer ' + (nx === 'flop' ? 'au flop' : 'à la ' + STREET_LABEL[nx].toLowerCase()) + '</button>';
  const undo = hasActions() ? '<button type="button" class="link" data-act="uact">Annuler la dernière</button>' : '';
  return '<div class="builder"><div class="dk-h"><span class="dk-t"><b>' + esc(STREET_LABEL[st]) + '</b> · tour de mise terminé</span>' + undo + '</div>' +
    '<p class="dk-hint">' + why + ' Pour corriger une autre action : Détails, Historique.</p><div class="row">' + next + '</div></div>';
}
function dockAct(sim) {
  const st = ui.street, S = sim.streets[st], aid = dockActor(sim, st);
  if (!aid) return dockClosed(sim, st);
  const a = sim.byId[aid], nm = esc(aid === 'H' ? 'Hero' : labelOf(H, aid));
  const toCall = Math.max(0, S.bet - S.cur[aid]);
  const left = Number.isFinite(a.stack) ? a.stack - S.before[aid] - S.cur[aid] : NaN;
  const known = Number.isFinite(left);
  const kind = S.bet === 0 ? 'bet' : 'raise';
  const undo = hasActions() ? '<button type="button" class="link" data-act="uact">Annuler la dernière</button>' : '';
  let html;
  if (ui.pending) {
    const chips = (ui.pending === 'bet'
      ? BET_PCT.map(p => chip(p + '%<span class="sub">' + fmt(Math.round(S.potNow * p / 10) / 10) + '</span>', { cls: 'stack', attrs: 'data-act="size" data-k="pct" data-v="' + p + '"' }))
      : RAISE_X.map(x => chip(x + 'x<span class="sub">' + fmt(Math.round(S.bet * x * 10) / 10) + '</span>', { cls: 'stack', attrs: 'data-act="size" data-k="x" data-v="' + x + '"' })))
      ;
    const allin = chip('All-in' + (known && left > 0 ? ' ' + fmt(left) : ''), { dis: !(known && left > 0), attrs: 'data-act="do" data-t="allin"' });
    html = '<div class="dk-h"><span class="dk-t"><b>' + nm + '</b> · ' + (ui.pending === 'bet' ? 'bet' : 'raise') + ' : quelle taille ?</span>' +
      '<button type="button" class="link" data-act="pend" data-t="' + ui.pending + '">Retour</button></div>' +
      '<div class="dk-sz">' + chips.join('') + '</div>' +
      '<div class="dk-z3"><input class="inp num sm" id="in-size" inputmode="decimal" placeholder="bb" aria-label="Montant total en bb">' +
      '<button type="button" class="btn ghost sm" data-act="size" data-k="bb">' + (ui.pending === 'bet' ? 'Mise de' : 'Relance à') + ' X bb</button>' + allin + '</div>';
  } else {
    const acts = [];
    if (toCall > 0) {
      acts.push(chip('Fold', { attrs: 'data-act="do" data-t="fold"' }));
      acts.push(chip('Call ' + fmt(known ? Math.min(toCall, left) : toCall), { attrs: 'data-act="do" data-t="call"' }));
    } else {
      acts.push(chip('Check', { attrs: 'data-act="do" data-t="check"' }));
    }
    acts.push(chip(kind === 'bet' ? 'Bet' : 'Raise', { dis: known && left <= toCall, attrs: 'data-act="pend" data-t="' + kind + '"' }));
    acts.push(chip('All-in' + (known && left > 0 ? ' ' + fmt(left) : ''), { dis: !(known && left > 0), attrs: 'data-act="do" data-t="allin"' }));
    const sub = 'pot ' + fmt(S.potNow) + (Number.isFinite(S.spr) ? ' · SPR ' + fmt(Math.round(S.spr * 10) / 10) : '') + (st === 'preflop' && S.rows.length ? ' · ' + potKind(sim.raises) : '');
    html = '<div class="dk-h"><span class="dk-t"><b>' + esc(STREET_LABEL[st]) + '</b> · à <b>' + nm + '</b> de parler</span>' + undo + '</div>' +
      '<div class="dk-sub">' + esc(sub) + (known ? '' : ' · <button type="button" class="link sm" data-act="dock" data-v="seats" data-id="' + esc(aid) + '">stack de ' + nm + ' ?</button> (All-in, SPR)') + '</div><div class="row">' + acts.join('') + '</div>';
  }
  return '<div class="builder">' + html + '</div>';
}

/* the seat last touched: its stack (and the ante, with the Hero's), the cards seen and a read for an adversary */
function dockSeats() {
  const id = tblFocusId();
  if (!id) return '';
  if (id === 'H') {
    return '<div class="dk-h"><span class="dk-t"><b>Hero</b> · ' + esc(posLabel(H.table, H.hero.pos)) + '</span><button type="button" class="link" data-act="hmove">Changer de siège</button></div>' +
      '<div class="dk-r"><span class="dk-l">Stack</span>' + stackRow('hstack', '', H.hero.stack) + '</div>' +
      (H.villains.some(v => inHand(H, v)) ? '' : '<p class="dk-hint">Touche un siège pour ajouter un adversaire. Un siège vide ne joue pas.</p>');
  }
  const v = H.villains.find(x => x.id === id);
  const pk = ui.picker && ui.picker.group === v.id ? ui.picker.i : -1;
  return '<div class="dk-h"><span class="dk-t"><b>Adversaire</b> · ' + esc(posLabel(H.table, v.pos)) + '</span><button type="button" class="link bad" data-act="delv" data-id="' + v.id + '">Retirer</button></div>' +
    '<div class="dk-r"><span class="dk-l">Stack</span>' + stackRow('vstack', v.id, v.stack) + '</div>' +
    '<div class="dk-r"><span class="dk-l">Vues</span><div class="cards">' + v.cards.map((c, i) => slotBtn(v.id, i, c, pk === i)).join('') + '</div>' +
    '<input class="inp" id="in-read-' + v.id + '" placeholder="Lecture : reg, fish, short stack..." value="' + esc(v.read) + '" data-in="read" data-id="' + v.id + '" autocomplete="off" aria-label="Lecture sur l\'adversaire"></div>';
}

/* the end of the hand: the Bilan is a window over the table (it opens with « Résultat »); here, what it holds so far and a way back to it */
function dockEnd() {
  const n = H.tags.length;
  const bits = [H.result ? RESULT_FR[H.result] : '', H.phase || '', n ? n + ' tag' + (n > 1 ? 's' : '') : '', (H.note || '').trim() ? 'note' : '',
    H.verdict === 'good' ? '✓ Bon' : H.verdict === 'bad' ? '✗ Mauvais' : ''].filter(Boolean);
  return '<div class="dk-h"><span class="dk-t"><b>Bilan</b> de la main</span></div>' +
    '<p class="dk-hint">' + esc(bits.length ? bits.join(' · ') : 'Résultat, cartes vues, phase, tags, note, verdict.') + '</p>' +
    '<div class="row"><button type="button" class="btn sm" data-act="bil">' + (bits.length ? 'Modifier le Bilan' : 'Ouvrir le Bilan') + '</button></div>';
}

function dockHtml(sim, mode) {
  const waiting = photosWaiting().length + (photoOk(H.photo) ? 1 : 0);
  const fid = tblFocusId();
  if (!H.hero.pos && fid && fid !== 'H') return '<div class="dock"><div class="dk-b">' + dockSeats() + '</div></div>';   /* a villain looked at while the Hero's seat is free */
  if (!H.hero.pos) return '<div class="dock off"><p class="dk-hint">Choisis la taille de la table, fais-la tourner si besoin, puis touche ta place. Les adversaires viennent ensuite : touche leur siège.</p>' +
    '<button type="button" class="btn ghost sm" data-act="det">Détails · date, ante, photos' + (waiting ? '<i class="dot"></i>' : '') + '</button></div>';
  const go = mode === 'seats' && !hasActions();
  const sw = '<div class="seg dk-sw" role="group" aria-label="Étape de la saisie">' +
    [['seats', 'Sièges'], ['act', 'Action'], ['end', 'Résultat']].map(k => '<button type="button" class="' + (mode === k[0] ? 'on' : '') + (go && k[0] === 'act' ? ' go' : '') + '" data-act="dock" data-v="' + k[0] + '">' + k[1] + '</button>').join('') +
    '<button type="button" data-act="det">Détails' + (waiting ? '<i class="dot"></i>' : '') + '</button></div>';
  return '<div class="dock">' + sw + '<div class="dk-b">' + (mode === 'act' ? dockAct(sim) : mode === 'end' ? dockEnd() : dockSeats()) + '</div></div>';
}

/* one screen: the line, the table, the panel. The height is what is left between the header and the bar at the bottom, so the page does not scroll; on a screen too short for
   that the page scrolls a little instead. */
function stageFit() {
  const root = document.documentElement, st = document.querySelector('#view-edit .stage');
  if (!st || $('#view-edit').hidden) { root.classList.remove('stage-fit'); return; }
  const nav = $('#nav'), plus = $('#nv-plus');
  const probe = $('#safe-probe');
  /* the home bar margin is taken off only when it is inside the page: an app installed on the iPhone may get a viewport already shorter than
     the screen by more than that margin (seen on an iPhone 16 Pro Max: 62 pt short), and taking it off again would waste its height */
  const sb = probe ? probe.offsetHeight : 0, lost = Math.max(0, (window.screen && screen.height || 0) - window.innerHeight);
  let bottom = window.innerHeight - Math.max(0, sb - lost) - 8;
  if (nav && !nav.hidden && !nav.classList.contains('peek')) bottom = Math.min(nav.getBoundingClientRect().top, plus ? plus.getBoundingClientRect().top : 1e9);   /* the bar brought back over Saisir floats: the table keeps its size */
  const avail = bottom - st.getBoundingClientRect().top - 10;
  const hh = Math.max(avail, 500) + 'px';
  root.classList.toggle('stage-fit', avail >= 500);
  if (st.style.height !== hh) { st.style.height = hh; if (TBL.geoKey) tblPlace(); }   /* the table changed size: its seats follow */
}
window.addEventListener('resize', () => { if (ui.block === 'mains' && ui.tab === 'edit') { stageFit(); tblPlace(); } });
window.addEventListener('orientationchange', () => setTimeout(() => { if (ui.block === 'mains' && ui.tab === 'edit') { stageFit(); tblPlace(); } }, 250));
function secStage(sim) {
  const mode = dockMode();
  const peekBtn = isWide() ? '' : '<button type="button" class="nav-peek" data-act="navpeek" aria-label="Afficher la barre : Suivi, nouvelle main, Mains">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>';
  return '<div class="stage' + (H.hero.pos ? '' : ' nohero') + '" data-mode="' + mode + '">' + srowHtml(mode) + tbarHtml() + tblHtml(sim, mode) + dockHtml(sim, mode) + peekBtn + '</div>';
}

/* the history of the actions, street by street; deleting one that has others after it asks a second tap */
function secHistory(sim) {
  const ask = (ui.delAsk || '').split(':');
  let out = '';
  STREETS.forEach(st => {
    const S = sim.streets[st];
    if (!S.rows.length) return;
    const plan = ask[0] === st && +ask[2] === H.streets[st].length ? delPlan(H, st, +ask[1]) : null;
    out += '<div class="hist-s"><span class="lbl">' + esc(STREET_LABEL[st]) + '</span><span class="sub">pot ' + fmt(S.potNow) + '</span></div><ol class="log">' + S.rows.map(r => {
      const idx = H.streets[st].indexOf(r.e);
      const armed = plan && idx === +ask[1], gone = plan && idx > +ask[1] && idx > plan.keep;
      return '<li' + (gone ? ' class="gone"' : '') + '><span class="who' + (r.id === 'H' ? ' hero' : '') + '">' + esc(labelOf(H, r.id)) + '</span><span class="what">' + esc(rowText(r)) + '</span>' +
        '<span class="after">pot ' + fmt(r.potAfter) + '</span><button type="button" class="x' + (armed ? ' armed' : '') + '" data-act="delentry" data-st="' + st + '" data-i="' + idx + '" aria-label="' +
        (armed ? 'Confirmer la suppression' : 'Supprimer cette action') + '">' + (armed ? 'Supprimer' : '×') + '</button></li>';
    }).join('') + '</ol>';
    if (plan) out += '<p class="hint delwarn"><b>' + (plan.extra === 1 ? 'Une autre action ne tiendrait plus' : plan.extra + ' autres actions ne tiendraient plus') + '.</b> ' +
      'Les actions qui suivent ne seraient plus possibles sans celle-ci : elles partiraient avec elle' + (H.streets[st].length - 1 - plan.keep < plan.extra ? ' (y compris sur les tours suivants)' : '') + '. ' +
      'Touche « Supprimer » pour confirmer.</p><div class="row"><button type="button" class="btn ghost sm" data-act="delcancel">Annuler</button></div>';
  });
  return '<div class="sec" id="sec-action"><div class="sec-h"><span class="lbl">Historique</span></div>' + (out || '<p class="hint" style="margin:0">Aucune action pour l\'instant.</p>') + '</div>';
}

/* what is not the table nor the Bilan, in a window over it */
function secDetails(sim) {
  return (editingId ? cmtShow(H) : '') + secContext() + secPhotos() + secHistory(sim) + secTools();
}

function confirmBtn(key, label, yes) {
  return ui.confirm === key
    ? '<button type="button" class="btn danger sm" data-act="do-' + key + '">' + yes + '</button><button type="button" class="btn ghost sm" data-act="confirm" data-v="">Annuler</button>'
    : '<button type="button" class="btn ghost sm" data-act="confirm" data-v="' + key + '">' + label + '</button>';
}

/* the end of the details: the hand as text, sent to Replay, emptied or deleted */
function secTools() {
  const extra = editingId
    ? confirmBtn('del', 'Supprimer', 'Confirmer la suppression') + confirmBtn('abandon', 'Abandonner les changements', 'Abandonner')
    : '';   /* a new hand is emptied by the ✕ of the header */
  return '<div class="sec"><div class="row"><button type="button" class="btn ghost sm" data-act="copy">Copier le texte</button><button type="button" class="btn ghost sm" data-act="replay">Faire deviner</button>' + extra + '</div></div>';
}

/* the Bilan: everything about how the hand ended, in one window opened by « Résultat ». What is noted right after the hand comes first,
   what is noted after GTO Wizard last; the hand is saved from the bottom of it. */
function secBilan(sim) {
  const tagsAll = Array.from(new Set(TAGS.concat(store.hands.reduce((a, h) => a.concat(h.tags || []), [])).concat(H.tags)));
  const F = sim.streets.river.folded, vs = H.villains.filter(v => inHand(H, v) && !F[v.id]);
  const iss = issues(H);
  return '<div class="sec" id="sec-result">' +
    fld('Résultat', '<div class="row">' + RESULTS.map(r => chip(r[1], { on: H.result === r[0], attrs: 'data-act="result" data-v="' + r[0] + '"' })).join('') + '</div>') +
    (vs.length ? fld('Cartes vues', '<div class="scroll-row">' + vs.map(v => '<span class="dk-v"><span class="dk-vn">' + esc(posLabel(H.table, v.pos)) + '</span>' +
      v.cards.map((c, i) => slotBtn(v.id, i, c, false)).join('') + '</span>').join('') + '</div>') : '') +
    fld('Phase du tournoi', '<div class="row">' + PHASES.map(p => chip(esc(p), { on: H.phase === p, attrs: 'data-act="phase" data-v="' + esc(p) + '"' })).join('') + '</div>') +
    fld('Tags', '<div class="row">' + tagsAll.map(t => chip(esc(t), { on: H.tags.indexOf(t) >= 0, attrs: 'data-act="tag" data-v="' + esc(t) + '"' })).join('') + '</div>' +
      '<div class="stackrow"><input class="inp" id="in-tag" placeholder="Nouveau tag" value="' + esc(ui.tagDraft) + '" data-in="tagdraft" autocomplete="off" aria-label="Nouveau tag"><button type="button" class="btn ghost sm" data-act="addtag">Ajouter</button></div>') +
    fld('Note', '<textarea class="inp" id="in-note" data-in="note" placeholder="Ce que tu as pensé, le spot qui te gêne, la lecture sur le joueur...">' + esc(H.note) + '</textarea>') +
    fld('Verdict après GTO Wizard', '<div class="row">' + chip('✓ Bon', { on: H.verdict === 'good', cls: 'vgood', attrs: 'data-act="verdict" data-v="good"' }) +
      chip('✗ Mauvais', { on: H.verdict === 'bad', cls: 'vbad', attrs: 'data-act="verdict" data-v="bad"' }) + '</div>') +
    fld(H.verdict === 'bad' ? 'Correction (ce qu\'il fallait faire)' : 'Commentaire après la revue', '<textarea class="inp" id="in-comment" data-in="comment" maxlength="1000" placeholder="' + (H.verdict === 'bad' ? 'Ce qu\'il fallait faire...' : 'Optionnel') + '">' + esc(H.comment) + '</textarea>') +
    '</div>' +
    '<button type="button" class="btn" data-act="save">' + (editingId ? 'Mettre à jour la main' : 'Enregistrer la main') + '</button>' +
    (iss.length ? '<p class="hint" style="margin:0">Elle sera enregistrée comme « À compléter » : il manque ' + esc(iss.join(', ')) + '.</p>' : '');
}

function renderEdit() {
  const sim = simulate(H);
  $('#view-edit').innerHTML = secStage(sim);
  stageFit(); tblSync(); tblPlace();
}

/* ===== table: the seat map of the hand (Saisir) =====
   The seats sit on an oval rim. Before the Hero has picked his seat, the table turns under the finger (with a little momentum) and always
   settles with a seat at the bottom; once he picks one, that seat glides to the bottom and stays there. One critically damped spring drives
   every turn (drag release, tap on a seat, arrow key), so nothing ever starts or stops abruptly. */
const TBL = { off: 0, v: 0, target: null, raf: 0, last: 0, drag: null, noClick: false, geo: null, geoKey: '', keep: false, fresh: '', bringing: false };
const tblN = () => TABLES[H.table].length;
const tblMod = (x, n) => ((x % n) + n) % n;
const tblIdx = pos => TABLES[H.table].indexOf(pos);
const tblCalm = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* the offset that puts the Hero's seat at the bottom — the one nearest to where the table is now, so it turns the short way */
function tblHome() {
  const j = tblIdx(H.hero.pos), n = tblN();
  if (j < 0) return TBL.off;
  return -j + n * Math.round((TBL.off + j) / n);
}

/* the table: a stadium (straight top and bottom, round ends) about 3 wide for 2 high (up to 1.6 wide when the height is what limits it), as big as
   the box allows with room around it for the seats and their labels. The side seats may reach into the margin of the page. On a big screen the
   seats grow with the table (ss, up to 1.5x). The seats sit on its outer edge. The edge is walked from the bottom centre, clockwise on screen, with the
   straight parts counting for less than the round ends (TBL_WS), so the seats near the corners sit towards the corners as on the drawing.
   pts / cum: 361 points evenly spaced on that walk (u = k / 360), which the seats and the finger both use. */
const TBL_R = 1.48, TBL_RMAX = 1.6, TBL_RMIN_PH = 1.3, TBL_WS = 0.37, TBL_MX = 12, TBL_MY = 46, TBL_MY_PH = 30;
function tblGeo(W, Hh, ph) {
  const key = W + 'x' + Hh + (ph ? 'p' : 'w');
  if (TBL.geoKey === key) return TBL.geo;
  /* on a phone the table may also stretch upwards and downwards (down to 1.3 wide for 1 high) when the height is there */
  const my = ph ? TBL_MY_PH : TBL_MY, rmin = ph ? TBL_RMIN_PH : TBL_R;
  const fit = ss => { const wm = W - 2 * TBL_MX * ss, hm = Hh - 2 * my * ss, hh = Math.max(95, Math.min(hm, wm / rmin)); return [Math.max(140, Math.min(wm, hh * TBL_RMAX)), hh]; };
  let ss = 1;
  for (let it = 0; it < 4; it++) ss = Math.max(1, Math.min(1.5, fit(ss)[1] / 260));
  const wh = fit(ss), w = wh[0], h = wh[1], r = h / 2, L = w - h;
  const x = (W - w) / 2, y = (Hh - h) / 2, cx = W / 2, cy = Hh / 2, lx = x + r, rx = x + w - r;
  const half = L / 2 * TBL_WS, arc = Math.PI * r, len = 2 * half + 2 * arc + L * TBL_WS;   /* bottom (left half), left end, top, right end, bottom (right half) */
  const at = sp => {
    if (sp < half) return [cx - sp / TBL_WS, y + h];
    sp -= half;
    if (sp < arc) { const t = Math.PI / 2 + sp / r; return [lx + r * Math.cos(t), cy + r * Math.sin(t)]; }
    sp -= arc;
    if (sp < L * TBL_WS) return [lx + sp / TBL_WS, y];
    sp -= L * TBL_WS;
    if (sp < arc) { const t = 3 * Math.PI / 2 + sp / r; return [rx + r * Math.cos(t), cy + r * Math.sin(t)]; }
    sp -= arc;
    return [rx - Math.min(sp, half) / TBL_WS, y + h];
  };
  const M = 360, pts = [], cum = [];
  for (let k = 0; k <= M; k++) { pts.push(k === M ? pts[0].slice() : at(k / M * len)); cum.push(k / M * len); }
  TBL.geoKey = key;
  TBL.geo = { W: W, H: Hh, pts: pts, cum: cum, len: len, cx: cx, cy: cy, x: x, y: y, w: w, h: h, rail: Math.max(9, h * 0.056), band: Math.max(10, h * 0.07), ss: ss };
  return TBL.geo;
}
function tblPt(g, u) {
  const L = tblMod(u, 1) * g.len, c = g.cum;
  let lo = 0, hi = c.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (c[m] <= L) lo = m; else hi = m; }
  const f = (L - c[lo]) / ((c[hi] - c[lo]) || 1), p0 = g.pts[lo], p1 = g.pts[hi];
  return [p0[0] + (p1[0] - p0[0]) * f, p0[1] + (p1[1] - p0[1]) * f];
}

/* puts every seat where the current offset says (called after each render and on each animation frame; only transforms move) */
function tblPlace(fast) {
  const box = $('#tbl');
  if (!box) return;
  let g = TBL.geo;
  if (!fast || !g) {   /* during a turn the size is known: no measuring, so nothing forces a layout in the middle of a frame */
    const W = box.clientWidth, Hh = box.clientHeight;
    if (!W || !Hh) { requestAnimationFrame(() => tblPlace()); return; }   /* the screen is not shown yet: try again when it is */
    g = tblGeo(W, Hh, box.classList.contains('ph'));
    box.style.setProperty('--k', Math.max(0.7, Math.min(1.9, g.h / 250)).toFixed(3));   /* the pot, the board and the Hero's cards follow the size of the table */
    box.style.setProperty('--ss', g.ss.toFixed(3));   /* the seats: full size on a phone, bigger on a big table */
  }
  const svg = box.firstElementChild;
  if (!fast && svg && svg.dataset.k !== TBL.geoKey) {
    svg.setAttribute('viewBox', '0 0 ' + g.W + ' ' + g.H);
    /* each layer is the stadium, drawn inside by its inset: the shadow and the rail at the edge, the felt inside the rail */
    const ins = { 't-sh': 0, 't-rail': 0, 't-spec': g.rail * 0.32, 't-rim': 0.75, 't-band': g.rail, 't-lip': g.rail + 0.6, 't-felt': g.rail + g.band, 't-gl': g.rail + g.band + 1 };
    const spec = svg.querySelector('.t-spec');
    if (spec) spec.setAttribute('stroke-width', (g.rail * 0.34).toFixed(1));
    svg.querySelectorAll('rect').forEach(el => {
      const d = ins[el.getAttribute('class')] || 0;
      el.setAttribute('x', (g.x + d).toFixed(1)); el.setAttribute('y', (g.y + d).toFixed(1));
      el.setAttribute('width', (g.w - 2 * d).toFixed(1)); el.setAttribute('height', (g.h - 2 * d).toFixed(1));
      el.setAttribute('rx', (g.h / 2 - d).toFixed(1));
    });
    svg.dataset.k = TBL.geoKey;
  }
  const tin = box.querySelector('.tin');   /* the pot, the board and the Hero's cards are laid out on the table itself, not on the box */
  if (!fast && tin) tin.style.cssText = 'left:' + g.x.toFixed(1) + 'px;top:' + g.y.toFixed(1) + 'px;width:' + g.w.toFixed(1) + 'px;height:' + g.h.toFixed(1) + 'px';
  const n = tblN();
  box.querySelectorAll('.seat').forEach(s => {
    const p = tblPt(g, (+s.dataset.j + TBL.off) / n);
    s.style.transform = 'translate3d(' + p[0].toFixed(2) + 'px,' + p[1].toFixed(2) + 'px,0) translate(-50%,-50%)';
    /* a computer: the labels of the top half above the seats, outside the table. A phone: every label under its seat (the pot is under the board),
       except on the bottom straight (the Hero's seat), where it goes beside the seat so the table can come down closer to the panel */
    const ph = box.classList.contains('ph');
    s.classList.toggle('up', !ph && p[1] < g.cy - 0.5);
    s.classList.toggle('side', ph && p[1] > g.y + g.h - 0.5);
    const ex = (p[0] - g.x) / g.w;   /* the far left and right of the table: the label is kept on the inside */
    s.classList.toggle('edl', ex < 0.06);
    s.classList.toggle('edr', ex > 0.94);
    const c = s.querySelector('.sc');   /* the cards seen on a villain lie towards the middle of the table */
    if (c) {
      const dx = g.cx - p[0], dy = g.cy - p[1], d = Math.hypot(dx, dy) || 1;
      c.style.transform = ph   /* a phone: beside the seat, on the side of the middle (its label is under it) */
        ? 'translate(' + ((Math.abs(dx) < 1 ? 1 : Math.sign(dx)) * 40 * g.ss).toFixed(1) + 'px,0) translate(-50%,-50%)'
        : 'translate(' + (dx / d * 47 * g.ss).toFixed(1) + 'px,' + (dy / d * 40 * g.ss).toFixed(1) + 'px) translate(-50%,-50%)';
    }
  });
}
/* with the Hero seated, his seat is at the bottom whatever happened (stored hand opened, table size changed…), unless a turn is under way */
function tblSync() {
  if (!H.hero.pos || TBL.target !== null || TBL.drag || TBL.keep) return;
  TBL.off = tblHome(); TBL.v = 0;
}

/* the spring: critically damped, exact for any frame time, so a release at any speed flows into the settling */
function tblSpringTo(target) {
  TBL.target = target;
  if (tblCalm()) { TBL.off = target; TBL.v = 0; TBL.target = null; tblPlace(); return; }
  TBL.last = 0;
  if (!TBL.raf) TBL.raf = requestAnimationFrame(tblStep);
}
function tblStep(ts) {
  TBL.raf = 0;
  if (TBL.target === null) return;
  const dt = Math.min(0.05, TBL.last ? (ts - TBL.last) / 1000 : 0.016);
  TBL.last = ts;
  const w = 10, A = TBL.off - TBL.target, B = TBL.v + w * A, k = Math.exp(-w * dt);
  TBL.off = TBL.target + (A + B * dt) * k;
  TBL.v = (B - w * (A + B * dt)) * k;
  if (Math.abs(TBL.off - TBL.target) < 0.0004 && Math.abs(TBL.v) < 0.002) {
    const n = tblN();
    TBL.off = tblMod(TBL.target, n); TBL.v = 0; TBL.target = null;
    tblPlace(true);
    return;
  }
  tblPlace(true);
  TBL.raf = requestAnimationFrame(tblStep);
}

/* ---- what the table shows ---- */
function tblFocusId() {
  const id = ui.seat;
  if (id === 'H' && H.hero.pos) return 'H';
  if (id && id !== 'H' && H.villains.some(v => v.id === id)) return id;
  return H.hero.pos ? 'H' : null;
}
/* the panel under the table: seats (stacks, cards seen), action (fold / call / raise), result */
function hasActions() { return STREETS.some(s => H.streets[s].length); }
function dockMode() { return H.hero.pos ? (ui.mode || (hasActions() ? 'act' : 'seats')) : 'seats'; }
/* who is to speak on the street being looked at: the seat touched if it may speak, else the next one in turn */
function dockActor(sim, st) {
  const alive = toAct(sim, st);

/* what a seat shows of its last action on this street */
function rowShort(r) {
  const e = r.e;
  if (e.t === 'fold') return 'fold';
  if (e.t === 'check') return 'check';
  if (e.t === 'call') return 'call ' + fmt(r.add);
  if (e.t === 'allin') return 'all-in ' + fmt(r.to);

function seatHtml(p, j, foc, cx) {
  const isH = H.hero.pos === p, v = isH ? null : H.villains.find(x => x.pos === p), id = isH ? 'H' : v ? v.id : '';
  const stk = isH ? num(H.hero.stack) : v ? num(v.stack) : 0;
  const dealer = p === 'BTN' || (H.table === 'HU' && p === 'SB');

  const act = !!(acting && id && cx.aid === id);

  const last = id && cx ? cx.S.rows.filter(r => r.id === id).pop() : null;
  const lbl = isH ? 'Hero, ' + posLabel(H.table, p) : v ? 'Adversaire, ' + posLabel(H.table, p) : 'Siège ' + posLabel(H.table, p) + ', libre';
  const cards = v && v.cards.some(Boolean) ? '<span class="sc">' + v.cards.map(c => c ? cardFace(c, 'mini') : '').join('') + '</span>' : '';
  return '<button type="button" class="seat' + (isH ? ' hero' : v ? ' vil' : '') + (on ? ' foc' : '') + (act ? ' act' : '') + (folded ? ' fold' : '') + '"' + (acting && id && cx.may[id] ? ' data-may="1"' : '') + ' data-act="seat" data-p="' + esc(p) + '" data-j="' + j + '" aria-label="' + esc(lbl + (last ? ', ' + rowShort(last) : '') + (act ? ', à parler' : '')) + '">' +
    (isH ? '<span class="sh">Hero</span>' : '') + '<span class="sp' + (p.length > 4 ? ' lg' : '') + '">' + esc(p) + '</span>' +
    (stk > 0 || last ? '<span class="sl">' + (stk > 0 ? '<span class="ss">' + fmt(stk) + '</span>' : '') + (last ? '<span class="sa">' + esc(rowShort(last)) + '</span>' : '') + '</span>' : '') +
    (dealer ? '<i class="dbtn">D</i>' : '') + cards + '</button>';

/* the board in the middle of the table: shown once the hand reaches the flop (an action, a card, the street being looked at, or a photo of the flop),
   then the turn and the river as the hand gets there. The slots are touched like the ones of the Action block. */
function tblBoard() {
  let last = STREETS.indexOf(ui.street);
  STREETS.forEach((s, i) => { if (i > 0 && (H.streets[s].length || H.board[s].some(Boolean))) last = Math.max(last, i); });
  if (photoOk(H.photo)) last = Math.max(last, 1);   /* a photo of the flop: the flop is known, its place is ready */
  if (last < 1) return '';

  return '<div class="bd" role="group" aria-label="Board">' + ['flop', 'turn', 'river'].map((g, k) => last < k + 1 ? '' :
    '<span class="bg">' + H.board[g].map((c, i) => slotBtn(g, i, c, !!pk && pk.group === g && pk.i === i)).join('') + '</span>').join('') + '</div>';
}

/* the line above the table: the size of the table while the seats are being set, the streets while the hand is being played */
function srowHtml(mode) {
  if (H.hero.pos && mode !== 'seats') {

}

function tblHtml(sim, mode) {

  const may = {}; if (mode === 'act') toAct(sim, ui.street).forEach(a => { may[a.id] = true; });

  const pk = ui.picker && ui.picker.group === 'hero' ? ui.picker.i : -1;
  /* a polished rail lit from above (lighter on top, a bright edge all round, a soft reflection along its top), a dark groove inside it,
     a fine line, then the felt with a faint sheen */
  const svg = '<svg class="tbl-svg" aria-hidden="true" focusable="false"><defs>' +
    '<linearGradient id="tbl-rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4b51"/><stop offset=".1" stop-color="#3a3b40"/><stop offset=".45" stop-color="#2a2b2f"/><stop offset=".88" stop-color="#1c1d20"/><stop offset="1" stop-color="#232428"/></linearGradient>' +
    '<linearGradient id="tbl-spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".22" stop-color="#fff" stop-opacity=".04"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>' +

    '<linearGradient id="tbl-lip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".6" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>' +
    '<linearGradient id="tbl-fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16171a"/><stop offset=".35" stop-color="#1c1d21"/><stop offset="1" stop-color="#18191c"/></linearGradient>' +
    '<radialGradient id="tbl-gl" cx="50%" cy="18%" r="55%"><stop offset="0" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>' +

/* a stack or the ante typed: the seats and the pot follow without redrawing the table */
function tblLive() {
  const box = $('#tbl');
  if (!box) return;
  box.querySelectorAll('.seat').forEach(s => {
    const p = s.dataset.p, isH = H.hero.pos === p, v = isH ? null : H.villains.find(x => x.pos === p);
    const stk = isH ? num(H.hero.stack) : v ? num(v.stack) : 0;

/* Choosing the Hero's seat: if the bottom of the table is hidden by the bar at the bottom of the screen, the page first scrolls just enough to show it, and only
   then does the table turn. Never both at once, and nothing scrolls after the other taps: a touch that lands on a moving screen lands in the wrong place. */
function tblBringIn(go) {
  const box = $('#tbl'), top = $('.top');
  let by = 0;
  if (box) {
    const hb = top ? top.getBoundingClientRect().bottom : 0, b = box.getBoundingClientRect();
    by = Math.min(Math.max(0, b.bottom + 6 - (window.innerHeight - 80)), Math.max(0, b.top - hb - 8));
  }
  if (by < 4) { go(); return; }

  window.scrollBy({ top: by, behavior: 'smooth' });

    if (done) return;
    const y = window.scrollY;
    if (Math.abs(y - y0) > 0.5) moved = true;
    still = moved && Math.abs(y - last) < 0.5 ? still + 1 : 0; last = y;
    if (still >= 3 || Math.abs(y - (y0 + by)) < 1 || performance.now() - t0 > 900) { done = true; TBL.bringing = false; go(); return; }
    requestAnimationFrame(wait);
  })();
}

/* A seat that moves while a finger lands on it (the table is still gliding) may be gone from under the finger when it lifts: the browser then sends the click
   to the table and the tap is lost. The seat that was under the finger when it came down gets the tap (touch and pen; not when the page was scrolling). */
let tblTap = null, tblScrolled = 0;
window.addEventListener('scroll', () => { if (!TBL.bringing) tblScrolled = performance.now(); }, { passive: true });   /* the page's own scroll (bringing the table in) is not a person's scroll */
document.addEventListener('pointerdown', e => {
  const s = e.target.closest && e.target.closest('.seat');
  tblTap = s && s.closest('#tbl') && e.pointerType !== 'mouse' && performance.now() - tblScrolled > 150
    ? { id: e.pointerId, p: s.dataset.p, x: e.clientX, y: e.clientY, t: performance.now(), seen: false } : null;
}, true);
window.addEventListener('pointerup', e => {
  const t = tblTap;
  if (!t || t.id !== e.pointerId) return;
  if (Math.hypot(e.clientX - t.x, e.clientY - t.y) > 10 || performance.now() - t.t > 600) { tblTap = null; return; }
  setTimeout(() => { if (tblTap === t) { tblTap = null; if (!t.seen && !TBL.noClick) A.seat({ dataset: { p: t.p } }); } }, 60);
}, true);
window.addEventListener('pointercancel', () => { tblTap = null; }, true);

/* ---- the finger: turning the table before the Hero is seated ----
   The table turns the way the finger goes round it: the finger's direction from the middle of the table is mapped on the rim, so the seat under the finger
   follows it on the top, the bottom and the sides alike. When the screen is a fixed one (nothing to scroll) any direction turns it; on a short screen that
   scrolls, only a sideways drag does, so the page can still be scrolled. */
function tblRimU(g, x, y) {
  if (!g.ang) {

    for (let k = 0; k <= 360; k++) {

/* search: no accents, no capitals, every word must be found somewhere in the hand (tournament, cards, positions, actions, note, tags, comment).
   Cards are understood the way players write them: "88" = a pair of eights, "AK" = ace-king (either order), "AKs" suited, "AKo" offsuit,
   "Ah" = the ace of hearts anywhere in the hand. Hero's cards and the villains' shown cards both count. */
const fold = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[\u2660\u2664]\uFE0F?/g, 's').replace(/[\u2665\u2661]\uFE0F?/g, 'h').replace(/[\u2666\u2662]\uFE0F?/g, 'd').replace(/[\u2663\u2667]\uFE0F?/g, 'c').toLowerCase();
const searchTerms = q => fold(q).split(/\s+/).filter(Boolean);
const RANK_STR = 'AKQJT98765432';
/* "ka", "AKs", "88", "109" → the canonical form of a two-card holding ("AK", "AKs", "88", "T9"), or null when the word is not one */
function holdQuery(tok) {
  const m = /^([2-9tjqka])([2-9tjqka])([so])?$/.exec(tok.replace(/10/g, 't'));
  if (!m) return null;
  let a = m[1].toUpperCase(), b = m[2].toUpperCase();
  if (RANK_STR.indexOf(a) > RANK_STR.indexOf(b)) { const x = a; a = b; b = x; }
  return a + b + (m[3] ? (a === b ? '#' : m[3]) : '');   /* "88s" cannot exist: it matches nothing */
}
const cardQuery = tok => /^[2-9tjqka][shdc]$/.test(tok.replace(/^10/, 't')) ? tok.replace(/^10/, 't') : null;
function holdForms(cards) {
  const c = (cards || []).filter(x => x && x[0] !== '?' && x[1] !== '?');
  if (c.length < 2) return [];
  let a = c[0][0], b = c[1][0];
  const suited = c[0][1] === c[1][1];
  if (RANK_STR.indexOf(a) > RANK_STR.indexOf(b)) { const x = a; a = b; b = x; }
  return a === b ? [a + b] : [a + b, a + b + (suited ? 's' : 'o')];
}
const hayCache = new Map();
function handHay(h) {
  const k = h.id + '|' + (h.updatedAt || '');
  let v = hayCache.get(k);
  if (v === undefined) {
    v = { s: '', forms: new Set(), cards: new Set() };
    try {
      const n = normHand(clone(h));
      v.s = fold(handText(n) + ' ' + (h.tags || []).join(' ') + ' ' + (h.comment || ''));
      holdForms(n.hero.cards).forEach(f => v.forms.add(f));
      n.villains.forEach(x => holdForms(x.cards).forEach(f => v.forms.add(f)));
      const all = [n.hero.cards].concat(n.villains.map(x => x.cards), STREETS.map(g => n.board[g]));
      all.forEach(l => (l || []).forEach(c => { if (c && c[0] !== '?' && c[1] !== '?') v.cards.add((c[0] + c[1]).toLowerCase()); }));
    } catch (e) { v.s = fold(h.tournament); }
    if (hayCache.size > 3000) hayCache.clear();
    hayCache.set(k, v);
  }

}
/* one word of the search against one hand */
function hayHas(v, t) {
  const hq = holdQuery(t);
  if (hq) return v.forms.has(hq);
  const cq = cardQuery(t);
  if (cq) return v.cards.has(cq);
  return v.s.indexOf(t) >= 0;
}
function filteredHands() {
  const all = sortedHands();
  let out = all;
  if (ui.filter === 'good') out = all.filter(h => h.verdict === 'good');
  else if (ui.filter === 'bad') out = all.filter(h => h.verdict === 'bad');
  else if (ui.filter === 'todo') out = all.filter(h => issues(normHand(h)).length);
  else if (ui.filter.indexOf('t:') === 0) { const k = normName(ui.filter.slice(2)); out = all.filter(h => normName(h.tournament) === k); }
  else if (ui.filter.indexOf('st:') === 0) out = ui.stageF ? all.filter(h => ui.stageF.ids.has(h.id)) : all;   /* the hands of one stage, opened from the Suivi */
  const T = searchTerms(ui.q);
  return T.length ? out.filter(h => { const v = handHay(h); return T.every(t => hayHas(v, t)); }) : out;
}
/* the search field: a magnifier, a clear button that shows once something is typed */
const SRCH_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>';

const pcGroups = () => tournamentGroups(store.hands).sort((a, b) => b.last - a.last || String(b.start).localeCompare(String(a.start)));
/* the hand shown: keep it if it still exists, otherwise the first one waiting in the most recent tournament that has any */
function pcEnsure() {
  if (ui.pc.sel && store.hands.some(h => h.id === ui.pc.sel)) return;
  ui.pc.end = false;
  const gs = pcGroups(), g = gs.find(x => x.hands.some(h => !h.verdict)) || gs[0];
  const h = g && (g.hands.find(x => !x.verdict) || g.hands[g.hands.length - 1]);
  ui.pc.sel = h ? h.id : null;
}
function pcSum(h) {
  const n = normHand(h), sim = simulate(n);
  let s = (n.hero.pos ? posLabel(n.table, n.hero.pos) : 'Position ?') + (num(n.hero.stack) > 0 ? ' · ' + fmt(num(n.hero.stack)) + ' bb' : '');
  if (sim.streets.preflop.rows.length) s += ' · ' + potKind(sim.raises);
  return s;
}
const pcStatus = h => h.verdict === 'good' ? '<span class="pst good" title="Bon">✓</span>' : h.verdict === 'bad' ? '<span class="pst bad" title="Mauvais">✗</span>' : '<span class="pst" title="À revoir">○</span>';

function pcSide() {
  const all = store.hands, s = reviewStats(all), r = goodRate(s), judged = s.good + s.bad, info = groupInfo();
  const sum = '<div class="sec pc-sum"><div class="sec-h"><span class="lbl">Suivi</span><span class="pot">' + judged + ' analysée' + (judged > 1 ? 's' : '') + '</span></div>' +
    '<div class="tiles">' + tile('Mains', s.total) + tile('À revoir', s.pending) + tile('✓ Bon', s.good, 'good') + tile('✗ Mauvais', s.bad, 'bad') + '</div>' +
    (splitBar(s.good, s.bad) || '<div class="rbar" aria-hidden="true"></div>') +
    '<div class="rate">' + (r == null ? 'Aucune main notée pour l\'instant.' : '<b>' + r + ' %</b> de bonnes décisions · ' + s.good + ' sur ' + judged) + '</div>' +
    '<div class="row"><button type="button" class="btn ghost sm" data-act="exportjson">Sauvegarde .json</button><button type="button" class="btn ghost sm" data-act="importjson">Importer</button></div>' +
    (document.querySelector('#view-list #in-import') ? '' : IMPORT_INPUT) + '</div>';
  const list = pcGroups().map(g => {
    const t = reviewStats(g.hands), rr = goodRate(t), open = g.hands.some(h => h.id === ui.pc.sel);
    const rows = open ? '<div class="pg-rows">' + g.hands.map(h => {
      const n = normHand(h), cards = n.hero.cards.map(c => c ? cardFace(c, 'mini') : '<span class="card mini empty"><span class="r">?</span></span>').join('');
      return '<button type="button" class="pg-r' + (h.id === ui.pc.sel ? ' sel' : '') + '" data-act="pcsel" data-id="' + esc(h.id) + '"><span class="no">n°' + esc((info[h.id] || {}).no || '–') + '</span>' +
        '<span class="hand-cards">' + cards + '</span><span class="pg-s">' + esc(pcSum(h)) + '</span>' + (n.comment ? '<span class="pcm ' + cmtCls(n.verdict) + '" title="Commentaire">✎</span>' : '') + pcStatus(h) + '</button>';
    }).join('') + '</div>' : '';
    return '<div class="pg' + (open ? ' open' : '') + '"><button type="button" class="pg-h" data-act="pcgrp" data-id="' + esc(g.hands[0].id) + '">' +
      '<span class="trn-h"><span class="trn-n">' + esc(g.name || 'Sans nom') + '</span><span class="meta">' + esc(fmtDate(g.start)) + ' · ' + t.total + ' main' + (t.total > 1 ? 's' : '') + '</span></span>' +
      '<span class="trn-c"><span class="good">✓ ' + t.good + '</span><span class="bad">✗ ' + t.bad + '</span>' + (t.pending ? '<span class="pend">' + t.pending + ' à revoir</span>' : '') + '<span class="rt">' + (rr == null ? '–' : rr + ' %') + '</span></span>' +
      (splitBar(t.good, t.bad, true) || '<span class="rbar thin" aria-hidden="true"></span>') + '</button>' + rows + '</div>';
  }).join('');
  return '<aside class="pc-side">' + sum + '<div class="sec pc-trn"><div class="sec-h"><span class="lbl">Tournois</span></div><div class="pc-list">' + list + '</div></div></aside>';
}

function pcEnd(g) {
  const t = reviewStats(g.hands), r = goodRate(t), me = g.hands[0].id;
  const next = pcGroups().find(x => x.hands[0].id !== me && reviewStats(x.hands).pending);
  return '<section class="sec pc-main"><div class="sec-h"><span class="lbl">Tournoi noté</span><span class="pot">' + esc(g.name || 'Sans nom') + ' · ' + esc(fmtDate(g.start)) + '</span></div>' +
    '<div class="tiles">' + tile('✓ Bon', t.good, 'good') + tile('✗ Mauvais', t.bad, 'bad') + '</div>' + splitBar(t.good, t.bad) +
    (r == null ? '' : '<div class="rate"><b>' + r + ' %</b> de bonnes décisions</div>') +
    '<div class="row">' + (next ? '<button type="button" class="btn" data-act="pcgrp" data-id="' + esc(next.hands[0].id) + '">Revoir ' + esc(next.name || 'Sans nom') + ' (' + reviewStats(next.hands).pending + ')</button>' : '<span class="hint">Toutes tes mains sont notées.</span>') +
    '<button type="button" class="link" data-act="pcback">Revenir sur la dernière main</button></div></section>';
}

function pcMain() {
  const h0 = store.hands.find(x => x.id === ui.pc.sel);
  if (!h0) return '<section class="pc-main"></section>';
  const g = findGroup(h0.id), i = g.hands.findIndex(x => x.id === h0.id), total = g.hands.length;
  if (ui.pc.end) return pcEnd(g);
  const h = normHand(h0), no = (groupInfo()[h0.id] || {}).no || (i + 1);
  const hero = h.hero.cards.map(c => c ? cardFace(c, 'big') : '<span class="card big empty"><span class="r">?</span></span>').join('');
  const board = ['flop', 'turn', 'river'].reduce((a, s) => a.concat(h.board[s]), []).filter(Boolean).map(c => cardFace(c, 'big')).join('');
  const st = h.verdict ? '<span class="tag ver-' + h.verdict + '">' + (h.verdict === 'good' ? '✓ ' : '✗ ') + VERDICT_FR[h.verdict] + '</span>' : '<span class="tag">À revoir</span>';
  const vb = (v, glyph, label, key) => '<button type="button" class="pvb ' + v + (h.verdict === v ? ' on' : '') + '" data-act="pcset" data-v="' + v + '"><span class="g" aria-hidden="true">' + glyph + '</span><span>' + label + '</span>' + kbd(key) + '</button>';
  return '<section class="sec pc-main">' +
    '<div class="pc-top"><div><div class="lbl">' + esc(g.name || 'Sans nom') + ' · ' + esc(fmtDate(g.start)) + '</div>' +
    '<div class="pc-ttl">Main n°' + esc(no) + ' <span class="pc-of">sur ' + total + '</span>' + st + '</div></div>' +
    '<div class="pc-act"><div class="row pc-nav"><button type="button" class="btn ghost sm" data-act="pcprev"' + (i ? '' : ' disabled') + '>' + kbd('←') + ' Précédente</button>' +
    '<button type="button" class="btn ghost sm" data-act="pccopy">Copier la main ' + kbd('C') + '</button>' +
    '<button type="button" class="btn ghost sm" data-act="pcnext"' + (i < total - 1 ? '' : ' disabled') + '>Suivante ' + kbd('→') + '</button></div>' +
    '<div class="row pc-links"><button type="button" class="link" data-act="open" data-id="' + esc(h0.id) + '">Modifier la main</button>' +
    (h.verdict ? '<button type="button" class="link" data-act="pcclear">Retirer le verdict</button>' : '') + '</div></div></div>' +
    cmtBlock(h, ui.pc.edit && ui.pc.edit.id === h0.id ? ui.pc.edit : null, 'pc') +
    '<div class="pc-cards"><span class="hand-cards pc-hero">' + hero + '</span>' + (board ? '<span class="hand-board pc-board">' + board + '</span>' : '') + '</div>' +
    '<div class="pc-text">' + esc(exportTexts([h0])) + '</div>' +
    '<div class="pc-v">' + vb('bad', '✗', 'Mauvais', 'M') + vb('good', '✓', 'Bon', 'B') + '</div></section>';
}

function pcView() {
  if (!store.hands.length) {
    return '<div class="empty-state pc-empty"><p>Aucune main sur cet ordinateur.</p>' +
      '<p class="hint">Sur ton téléphone : onglet Mains → Sauvegarde .json, envoie le fichier à ton ordinateur (AirDrop, Fichiers, mail…), puis importe-le ici.</p>' +
      '<div class="row" style="justify-content:center"><button type="button" class="btn" data-act="importjson">Importer une sauvegarde</button></div>' +
      (document.querySelector('#view-list #in-import') ? '' : IMPORT_INPUT) + '</div>';
  }
  pcEnsure();
  return '<div class="pc-rv">' + pcSide() + pcMain() + '</div>';
}
/* next hand of the same tournament that still waits for a verdict (after this one, then from the start) */
function pcNext(id) {
  const g = findGroup(id);
  if (!g) return null;
  const i = g.hands.findIndex(h => h.id === id);
  return g.hands.slice(i + 1).concat(g.hands.slice(0, i)).find(h => !h.verdict) || null;
}

function renderReview() {
  const el = $('#view-review');
  if (!store.ready) { el.innerHTML = '<div class="empty-state">Chargement des mains...</div>'; return; }
  const typing = !!(document.activeElement && document.activeElement.id === 'in-fix');
  if (isWide()) {
    const old = el.querySelector('.pc-list'), keep = old ? old.scrollTop : 0;
    el.innerHTML = pcView();
    const box = el.querySelector('.pc-list'), cur = el.querySelector('.pg-r.sel');
    if (box) {   /* keep the list where it was, and the chosen hand in view */
      box.scrollTop = keep;
      if (cur) { const b = box.getBoundingClientRect(), r = cur.getBoundingClientRect(); if (r.top < b.top) box.scrollTop += r.top - b.top - 8; else if (r.bottom > b.bottom) box.scrollTop += r.bottom - b.bottom + 8; }
    }
    focusFixBox(typing);
    return;
  }
  el.innerHTML = ui.rv ? (ui.rv.done ? reviewDone() : reviewCard()) : reviewSummary();
  focusFixBox(typing);
}

function onPhotosChange() {

/* a message for a moment; with { undo: fn } it carries an « Annuler » button for 6 seconds */
function toast(msg, opt) {
  const t = $('#toast'), undo = opt && typeof opt.undo === 'function' ? opt.undo : null;
  ui.undo = undo;
  if (undo) t.innerHTML = '<span>' + esc(msg) + '</span><button type="button" class="t-undo" data-act="undo">Annuler</button>';
  else t.textContent = msg;
  t.classList.toggle('act', !!undo);
  t.hidden = false;
  clearTimeout(ui.toastTimer);
  ui.toastTimer = setTimeout(() => { t.hidden = true; ui.undo = null; }, undo ? 6000 : 2600);
}
async function copyText(text, title) {
  try { await navigator.clipboard.writeText(text); toast('Copié'); }
  catch (e) { ui.modal = { title: title || 'Texte', text: text, hint: 'Sélectionne tout puis copie.' }; renderSheet(); }
}
/* text of several hands, in the order they were entered (the first one entered comes first); each hand carries its number
   inside its tournament and the tournament's first date, so a tournament that ran past midnight reads as one */
function exportTexts(hands) {
  const info = groupInfo();
  return hands.slice().sort(byEntry).map(h => {
    const n = normHand(h), k = info[h.id];
    if (k) { n.handNo = k.no; n.date = k.date; }
    return handText(n);
  }).join('\n\n———\n\n');
}
const IMPORT_INPUT = '';   /* the file input is in the page itself (p2-body): the Mains list and the Suivi block share it */
/* share sheet (iPhone: "Enregistrer dans Fichiers", AirDrop, Messages...) */
async function shareFile(data, filename) {
  try {
    const f = new File([data], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: filename }); return 'shared'; }
  } catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  return 'unsupported';
}
/* restore or move hands from a backup file; same id = same hand, so it is updated, never duplicated.
   The most recently changed copy wins: an older file never overwrites a verdict given since on this device. */
async function importFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('Fichier illisible'); return; }
  const list = Array.isArray(data) ? data : (data && Array.isArray(data.hands) ? data.hands : []);
  const ok = list.filter(x => x && typeof x === 'object' && typeof x.id === 'string' && /^[\w-]{1,64}$/.test(x.id) && x.hero && typeof x.hero === 'object');
  const tl = data && !Array.isArray(data) && Array.isArray(data.tournaments) ? data.tournaments.map(tNorm).filter(Boolean) : [];
  if (!ok.length && !tl.length) { toast(data && !Array.isArray(data) && Array.isArray(data.tournaments) ? 'Aucun tournoi valide dans ce fichier' : 'Aucune main dans ce fichier'); return; }
  let n = 0, same = 0;
  for (const x of ok) {
    const cur = store.hands.find(y => y.id === x.id);
    if (cur && cur.updatedAt && String(x.updatedAt || '') <= String(cur.updatedAt)) { same++; continue; }
    try { const nh = normHand(clone(x)); nh.photo = cur && cur.photo ? cur.photo : ''; await storeSave(nh); n++; } catch (e) { /* skip this one */ }
  }
  const tm = tl.length ? tMerge(tl) : null, tn = tm ? tm.added + tm.updated : 0;
  if (tm && ui.block === 'suivi') renderSuivi(); else if (tm && ui.block === 'home') renderHome();
  if (!tm) { toast(!n && same ? 'Rien à importer : tout est déjà à jour' : n + ' main' + (n > 1 ? 's' : '') + ' importée' + (n > 1 ? 's' : '') + (same ? ' · ' + same + ' déjà à jour' : '')); return; }
  const parts = [];
  if (ok.length) parts.push(n ? n + ' main' + (n > 1 ? 's' : '') + ' importée' + (n > 1 ? 's' : '') : 'mains déjà à jour');
  parts.push(tn ? tn + ' tournoi' + (tn > 1 ? 's' : '') + ' importé' + (tn > 1 ? 's' : '') : 'tournois déjà à jour');
  toast(!n && !tn ? 'Rien à importer : tout est déjà à jour' : parts.join(' · ') + (tn && tm.same ? ' · ' + tm.same + ' déjà à jour' : ''));
}
async function downloadJson() {
  const data = JSON.stringify({ app: 'cariocace-copilot', version: 2, exportedAt: new Date().toISOString(), hands: sortedHands().map(stripPhoto), tournaments: tStore.list }, null, 2);
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (!dl && isWide()) {   /* a computer: a plain download, not a share sheet */
    const u = URL.createObjectURL(new Blob([data], { type: 'application/json' })), a = document.createElement('a');
    a.href = u; a.download = 'cariocace-copilot-' + todayStr() + '.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000); toast('Fichier enregistré'); markBackup(); return;
  }
  if (!dl) {
    const r = await shareFile(data, 'cariocace-copilot-' + todayStr() + '.json');
    if (r === 'shared') { toast('Sauvegarde partagée'); markBackup(); return; }
    if (r === 'cancelled') return;
    ui.modal = { title: 'Sauvegarde JSON', text: data, hint: 'Sélectionne tout puis copie pour garder une sauvegarde.' }; renderSheet(); return;
  }
  try { await dl.save({ filename: 'cariocace-copilot-' + todayStr() + '.json', data: data }); toast('Fichier enregistré'); markBackup(); }
  catch (e) { if (e && e.code === 'declined') return; toast('Export impossible' + (e && e.code ? ' (' + e.code + ')' : '')); }
}

/* ===== Suivi: tracker of live tournaments, everything in R$ =====
   One record per tournament: { id, date (first day), name, buyin (one bullet, fees included), bullets, gain (total won, bounties and deal included),
   place, paid (places paid), joueurs (field size), serie (KSOP...), etape (a stage of that series; by default the month): all optional, ft (final table), live (still playing), mental (3 marks), debrief, createdAt, updatedAt }. Stored on this device only, in its own key, and part of the same .json backup as the hands.
   Importing merges by id (the most recently changed copy wins) and never removes anything. */
const LS_TOURN = 'carnet-tournois-local', LS_BACKUP = 'carnet-derniere-sauvegarde', LS_BACKUP_N = 'carnet-sauvegarde-n';
const tStore = { list: [] };
const T_MAX = { money: 1e9, bullets: 999, place: 1e6 };
/* mental notes (a separate space): three marks from 0 to 10, never mixed with the money figures */
const M_KEYS = ['g', 'd', 'r'];
const M_LABEL = { g: 'Niveau de jeu', d: 'Discipline', r: 'Récupération émotionnelle' };
const M_SHORT = { g: 'Jeu', d: 'Discipline', r: 'Récup.' };
const fmt1 = n => n.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const cents = x => Math.round(x * 100) / 100;
const fmtN = n => cents(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
const fmtBRL = n => 'R$\u00a0' + fmtN(n);   /* no line break between R$ and the amount */
const fmtNetBRL = n => (n > 0 ? '+' : n < 0 ? '−' : '') + 'R$\u00a0' + fmtN(Math.abs(n));
const fmtNet = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmtN(Math.abs(n));

/* an amount typed by hand: "1000", "1 000", "1.000", "1.000,50", "250,5", "R$ 500" */
function tMoney(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? v : NaN;
  let s = String(v == null ? '' : v).replace(/[\s  ]/g, '').replace(/^R\$/i, '');
  if (!s) return NaN;
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
  else s = s.replace(',', '.');
  return /^(\d+\.?\d*|\.\d+)$/.test(s) ? parseFloat(s) : NaN;
}
function validDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
  if (!m) return false;
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return d.getUTCFullYear() === +m[1] && d.getUTCMonth() === +m[2] - 1 && d.getUTCDate() === +m[3];
}
/* a record read from storage or from a backup file: anything that is not clean is dropped, nothing is invented */
function tNorm(x) {
  if (!x || typeof x !== 'object' || typeof x.id !== 'string' || !/^[\w-]{1,64}$/.test(x.id)) return null;
  if (!validDate(x.date)) return null;
  const buyin = tMoney(x.buyin), gain = tMoney(x.gain), bullets = Math.floor(tMoney(x.bullets));
  if (!(buyin >= 0 && buyin <= T_MAX.money) || !(gain >= 0 && gain <= T_MAX.money) || !(bullets >= 1 && bullets <= T_MAX.bullets)) return null;
  let place = null;
  if (x.place !== null && x.place !== undefined && x.place !== '') {
    const p = Math.floor(tMoney(x.place));

/* ===== swipe left on a hand row to reveal "Supprimer" ===== */
const SW_W = 96;
let sw = null, swipeGuard = 0;
function setSwipe(wrap, open) {
  const row = wrap.querySelector('.hand');
  wrap.classList.toggle('open', open);
  if (open) wrap.classList.add('sw');
  row.style.transform = open ? 'translateX(' + (-SW_W) + 'px)' : '';
  if (!open) setTimeout(() => { if (!wrap.classList.contains('open')) wrap.classList.remove('sw'); }, 230);
}
function closeSwipes(except) {
  document.querySelectorAll('.swipe.open').forEach(s => { if (s !== except) setSwipe(s, false); });
}
(function initSwipe() {
  const list = $('#view-list');
  list.addEventListener('touchstart', e => {
    const wrap = e.target.closest('.swipe');
    closeSwipes(wrap);
    if (!wrap) return;
    const t = e.touches[0], isOpen = wrap.classList.contains('open');
    sw = { wrap: wrap, row: wrap.querySelector('.hand'), x0: t.clientX, y0: t.clientY, base: isOpen ? -SW_W : 0, x: isOpen ? -SW_W : 0, dir: null };
  }, { passive: true });
  list.addEventListener('touchmove', e => {
    if (!sw) return;
    const t = e.touches[0], dx = t.clientX - sw.x0, dy = t.clientY - sw.y0;
    if (sw.dir === null) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      sw.dir = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (sw.dir === 'x') { sw.wrap.classList.add('sw'); sw.row.style.transition = 'none'; }
    }
    if (sw.dir !== 'x') return;
    sw.x = Math.max(-SW_W - 20, Math.min(0, sw.base + dx));
    sw.row.style.transform = 'translateX(' + sw.x + 'px)';
  }, { passive: true });
  const end = () => {
    if (!sw) return;
    const s = sw; sw = null;
    if (s.dir !== 'x') return;
    s.row.style.transition = '';
    swipeGuard = Date.now() + 350;
    setSwipe(s.wrap, s.x < -SW_W / 2);
  };
  list.addEventListener('touchend', end);
  list.addEventListener('touchcancel', end);
})();

/* ===== back gesture =====
   Every screen that sits on top of another one (a section, a stage, a hand opened from the list, a sheet) gets one history entry.
   « Retour » (iPhone edge swipe, browser button) then closes the top screen instead of leaving the app. The depth always comes from what is on screen. */
let navBusy = false, navDirty = false, navTimer = 0;
const navHave = () => { const st = history.state; return st && typeof st.d === 'number' ? st.d : 0; };
const navOver = () => !!(ui.pview || ui.askOpen || ui.modal || ui.picker || ((ui.tf || ui.tcard) && ui.block === 'suivi'));
const navEdit = () => ui.block === 'mains' && ui.tab === 'edit';
function navDepth() {
  if (ui.block === 'home') return 0;
  let d = 1;
  if (ui.block === 'suivi' ? !!ui.tstage : (ui.tab === 'edit' && ui.hDet) || (ui.tab === 'review' && !!ui.rv)) d++;
  if (navEdit()) d += (ui.det ? 1 : 0) + (ui.bil ? 1 : 0);   /* the details and the Bilan: one level each */
  if (navOver()) d++;
  return d;
}
function navSettle() {
  clearTimeout(navTimer); navBusy = false;
  if (navDirty) { navDirty = false; navSync(); }
}
function navSync() {
  if (!window.history || !history.pushState) return;
  if (navBusy) { navDirty = true; return; }
  const want = navDepth(), have = navHave();
  if (want === have) return;
  try {
    if (want > have) { for (let i = have + 1; i <= want; i++) history.pushState({ d: i }, ''); return; }
    navBusy = true; navDirty = false;
    clearTimeout(navTimer);
    navTimer = setTimeout(() => { try { if (navHave() !== navDepth()) history.replaceState({ d: navDepth() }, ''); } catch (e) { /* no history */ } navSettle(); }, 1200);
    history.go(want - have);
  } catch (e) { navBusy = false; /* history refused: the screens still work, only the gesture is lost */ }
}
/* close the screen on top of the others */
function navClose() {
  if (ui.pview) A.phclose();
  else if (ui.askOpen) A['askopen-cancel']();
  else if (ui.modal) A.closemodal();
  else if (ui.picker) A.closesheet();
  else if (navEdit() && ui.det) A.detx();
  else if (navEdit() && ui.bil) A.bilx();
  else if (ui.tf && ui.block === 'suivi') AT.tclose();
  else if (ui.tcard && ui.block === 'suivi') AT.tcardx();
  else if (ui.block === 'suivi' && ui.tstage) AT.tback();
  else if (ui.block === 'mains' && ui.tab === 'review' && ui.rv) A.rvquit();
  else if (ui.block === 'mains' && ui.tab === 'edit' && ui.hDet) A.tab({ dataset: { v: ui.hFrom || 'list' } });
  else if (ui.block !== 'home') A.block({ dataset: { v: 'home' } });
}
window.addEventListener('popstate', e => {
  if (navBusy) { navSettle(); return; }   /* the echo of our own history.go: the screens are already right */
  const target = e.state && typeof e.state.d === 'number' ? e.state.d : 0;
  navBusy = true;
  for (let guard = 8; guard > 0 && navDepth() > target; guard--) navClose();
  navBusy = false; navDirty = false;
  navSync();   /* history went somewhere the screens are not (forward, old entry): bring it back in line */
});
{ const rs = renderSheet, rsu = renderSuivi; renderSheet = function () { rs(); navSync(); }; renderSuivi = function () { rsu(); navSync(); }; }
