<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0d">
<title>Main à deviner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700&display=swap">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
  /* Une colonne étroite : la table et la décision restent en haut, l'historique s'allonge dessous. */
  :root {
    --bg: #0a0a0d;
    --surface: #121217;
    --surface-2: #1a1a21;
    --line: #272731;
    --fg: #eceef4;
    --muted: #8b8d9c;
    --plat: #dfe2ee;
    --plat-ink: #0c0c10;
    --ok: #8db8ff;
    --miss: #e8607a;
    --card: #f1f2f6;
    --card-ink: #15161b;
    --suit-red: #d63a52;
    --shadow: rgba(0, 0, 0, 0.5);
    --table-hi: #1d1d29;
    --card-2: #e2e4ed;
    --font-display: 'Syne', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --font-body: 'Manrope', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    color: var(--fg);
    font: 400 15px/1.5 var(--font-body);
    padding-block: 20px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 20px; }
  .wrap > * { min-width: 0; }

  h1 { margin: 0; font: 700 24px/1.1 var(--font-display); letter-spacing: 0.01em; }
  h1 span { color: var(--muted); font-weight: 600; }
  .sub { margin: 8px 0 0; color: var(--muted); font-size: 14px; max-width: 46ch; }

  .lab {
    font: 500 11px/1.2 var(--font-mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* Saisie */
  .stack { display: grid; gap: 12px; }
  textarea {
    width: 100%;
    min-height: 280px;
    resize: vertical;
    background: var(--surface);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    font: 400 16px/1.55 var(--font-mono);
    white-space: pre-wrap;
  }
  .hint { margin: 0; color: var(--muted); font-size: 13px; }
  .err {
    margin: 0;
    padding: 12px 14px;
    border: 1px solid var(--miss);
    border-radius: 12px;
    color: var(--fg);
    font-size: 14px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }

  .btn {
    appearance: none;
    height: 48px;
    padding: 0 18px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface-2);
    color: var(--fg);
    font: 600 14px var(--font-body);
    cursor: pointer;
  }
  .btn.primary { background: var(--plat); border-color: var(--plat); color: var(--plat-ink); flex: 1 1 180px; }
  .btn.ghost { background: transparent; }
  .btn.sm { height: 36px; padding: 0 14px; font-size: 13px; }
  .btn:focus-visible, textarea:focus-visible, .opt:focus-visible { outline: 2px solid var(--plat); outline-offset: 2px; }

  /* Mode invité : une seule main */
  .share { display: grid; gap: 10px; }
  .share textarea { min-height: 0; font-size: 14px; resize: none; }
  .intro { display: grid; gap: 14px; }
  .intro .cards { display: flex; gap: 8px; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  .field input {
    width: 100%; height: 48px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface-2); color: var(--fg); font: 500 16px var(--font-body);
  }
  .field input:focus-visible { outline: 2px solid var(--plat); outline-offset: 2px; }
  .intro .err { padding: 10px 14px; }
  .ans { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
  .ans .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .ans .nm { font: 700 18px/1.2 var(--font-display); overflow-wrap: anywhere; }
  .ans .dt { font: 400 12px/1.3 var(--font-mono); color: var(--muted); }

  /* Jeu */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    display: grid;
    gap: 16px;
  }
  .strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .strip > div { display: grid; gap: 6px; }
  .strip .v { font: 500 18px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
  .strip .v.st { font: 700 18px/1.2 var(--font-display); }

  .board { display: flex; gap: 6px; }
  .pc {
    --cw: 44px;
    display: inline-grid;
    align-content: center;
    justify-items: center;
    width: var(--cw);
    aspect-ratio: 44 / 62;
    flex: none;
    background: linear-gradient(165deg, var(--card) 0%, var(--card-2) 100%);
    color: var(--card-ink);
    border-radius: 7px;
    line-height: 1;
    box-shadow: 0 6px 14px var(--shadow);
  }
  .pc b { display: block; font: 700 calc(var(--cw) * 0.44) / 1 var(--font-body); }
  .pc i { display: block; font-style: normal; font-size: calc(var(--cw) * 0.46); margin-top: -2px; }
  .pc.red { color: var(--suit-red); }
  .slot { width: 38px; aspect-ratio: 44 / 62; flex: none; border: 1px dashed var(--line); border-radius: 7px; }

  .hero { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .hero .who { display: grid; gap: 6px; }
  .hero .who .mono { font-size: 18px; }
  .hero .hand { display: flex; gap: 6px; }

  #play { gap: 12px; }
  .table {
    display: grid;
    gap: 14px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: radial-gradient(130% 120% at 50% 0%, var(--table-hi) 0%, var(--surface) 62%);
  }
  .tbl-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .potbox { display: grid; justify-items: end; gap: 4px; min-width: 0; text-align: right; }
  .potbox .lab.st { color: var(--plat); }
  .potv { font: 700 22px/1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .potv small { margin-left: 4px; font: 500 12px var(--font-mono); color: var(--muted); }
  .tbl-hero { display: flex; align-items: center; gap: 14px; }
  .tbl-hero .hand { display: flex; flex: none; }
  .tbl-hero .hand .pc:first-child { transform: rotate(-5deg); }
  .tbl-hero .hand .pc:last-child { transform: rotate(4deg); margin-left: -10px; }
  .tbl-hero .who { display: grid; gap: 4px; flex: 1; min-width: 0; }
  .tbl-hero .who .mono, .tocall .mono { font-size: 17px; font-weight: 500; }
  .tocall { display: grid; gap: 4px; justify-items: end; }
  .tocall.due .mono { color: var(--plat); }

  .seats { display: flex; flex-wrap: wrap; gap: 6px; }
  .seat {
    display: grid;
    justify-items: center;
    gap: 2px;
    min-width: 54px;
    padding: 6px 9px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface-2);
  }
  .seat b { font: 500 12px/1.2 var(--font-mono); }
  .seat em { display: block; min-height: 1.3em; font: 400 11px/1.3 var(--font-mono); font-style: normal; color: var(--muted); }
  .seat.me { border-color: var(--plat); }
  .seat.out { opacity: 0.38; }
  .seat.out b { text-decoration: line-through; }

  /* Décision */
  .decide { display: grid; gap: 14px; }
  .q { margin: 0; font: 700 17px/1.3 var(--font-display); }
  .opts { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 10px; }
  .opt {
    appearance: none;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 3px;
    height: 66px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface-2);
    color: var(--fg);
    font: 600 16px var(--font-body);
    cursor: pointer;
  }
  .opt small { font: 400 12px var(--font-mono); color: var(--muted); }
  .opt:not(:disabled):active { transform: scale(0.98); }
  .opt:disabled { cursor: default; opacity: 0.55; }
  .opt.sel:disabled { opacity: 1; border-color: var(--plat); }

  .verdict { display: grid; gap: 6px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; animation: rise 0.22s ease-out; }
  .verdict.ok { border-color: var(--ok); }
  .verdict.miss { border-color: var(--miss); }
  .verdict .big { font: 600 18px/1.3 var(--font-body); }
  .tag { font: 600 11px/1.2 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; }
  .tag.ok { color: var(--ok); }
  .tag.miss { color: var(--miss); }
  .muted { color: var(--muted); font-size: 14px; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Bilan */
  .score { font: 700 44px/1 var(--font-display); }
  .score small { font: 500 14px var(--font-mono); color: var(--muted); letter-spacing: 0.04em; margin-left: 8px; }
  .recap { display: grid; }
  .recap > div { display: grid; gap: 4px; padding: 12px 0; border-top: 1px solid var(--line); }
  .recap .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

  .show { display: grid; gap: 12px; padding-bottom: 4px; }
  .sd { display: flex; align-items: center; gap: 16px; }
  .sd .mono { min-width: 52px; font: 500 20px var(--font-mono); }
  .sdcards { display: flex; gap: 10px; }
  .sdcards .pc { animation: deal 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }

  /* Historique */
  .log { display: grid; gap: 4px; }
  .lg-h { display: flex; align-items: center; gap: 10px; padding-top: 14px; }
  .lg-h .s { font: 700 13px var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; }
  .lg-h .c { display: flex; gap: 4px; }
  .lg-h .p { margin-left: auto; font-size: 12px; color: var(--muted); }
  .act { display: flex; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .act .p { width: 56px; flex: none; font: 500 12px/1.9 var(--font-mono); color: var(--muted); }
  .act.hero-act { color: var(--plat); font-weight: 600; }
  .act.hero-act .p { color: var(--plat); }
  .note { margin: 8px 0 0; color: var(--muted); font-size: 13px; }

  /* Action en cours */
  .live { gap: 14px; min-height: 132px; align-content: start; }
  .live-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .now-line { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; animation: rise 0.28s ease-out; }
  .now-line .who { min-width: 56px; font: 500 16px var(--font-mono); color: var(--muted); }
  .now-line .what { font: 700 clamp(28px, 8.5vw, 38px) / 1.1 var(--font-display); }
  .now-line.facing { animation: none; }
  .now-line.hero-now .who, .now-line.hero-now .what { color: var(--plat); }
  .seat.acting { border-color: var(--plat); animation: pulse 0.9s ease-out; }
  .pc.deal { animation: deal 0.42s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes pulse { 0% { transform: scale(1.14); } 100% { transform: scale(1); } }
  @keyframes deal { from { opacity: 0; transform: translateY(-14px) scale(0.9); } to { opacity: 1; transform: none; } }

  .before { display: grid; gap: 8px; }

  /* Table ovale */
  .oval { position: relative; width: 100%; max-width: 440px; margin: 0 auto; aspect-ratio: 2.05 / 1; }
  .oval::before {
    content: "";
    position: absolute;
    inset: 13% 9%;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: radial-gradient(ellipse at 50% 35%, var(--table-hi) 0%, var(--bg) 100%);
    box-shadow: inset 0 0 0 6px var(--surface), inset 0 0 0 7px var(--line);
  }
  .ctr { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; gap: 6px; justify-items: center; }
  .oval .board { gap: 4px; }
  .oval .slot { width: 28px; }
  .ctr .info { font: 500 11px/1.2 var(--font-mono); color: var(--muted); white-space: nowrap; }
  .ctr .info b { color: var(--plat); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .oseat {
    position: absolute;
    transform: translate(-50%, -50%);
    display: grid;
    justify-items: center;
    gap: 1px;
    min-width: 46px;
    padding: 4px 7px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface-2);
  }
  .oseat b { font: 600 11px/1.2 var(--font-mono); }
  .oseat em { font: 400 10px/1.2 var(--font-mono); font-style: normal; color: var(--muted); }
  .oseat.me { border-color: var(--plat); }
  .oseat.out { opacity: 0.35; border-style: dashed; }
  .oseat.out b { text-decoration: line-through; }
  .oseat.acting { border-color: var(--plat); animation: pulseo 0.9s ease-out; }
  .oseat .bet {
    position: absolute;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--plat);
    color: var(--plat-ink);
    font: 600 11px/1.3 var(--font-mono);
    white-space: nowrap;
  }
  .dir-up .bet { bottom: calc(100% + 3px); left: 50%; transform: translateX(-50%); }
  .dir-down .bet { top: calc(100% + 3px); left: 50%; transform: translateX(-50%); }
  .dir-right .bet { left: calc(100% + 4px); top: 50%; transform: translateY(-50%); }
  .dir-left .bet { right: calc(100% + 4px); top: 50%; transform: translateY(-50%); }
  .dbtn {
    position: absolute;
    top: -7px;
    right: -7px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--fg);
    color: var(--bg);
    font: 700 9px/16px var(--font-mono);
    font-style: normal;
    text-align: center;
  }
  @keyframes pulseo { 0% { transform: translate(-50%, -50%) scale(1.15); } 100% { transform: translate(-50%, -50%) scale(1); } }

  /* Tailles */
  .opt.sel { border-color: var(--plat); }
  .sizes { display: grid; gap: 10px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .opt.sz { height: 56px; font-size: 15px; }
  .custom { display: flex; gap: 8px; }
  .custom input {
    flex: 1; min-width: 0; height: 44px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface-2); color: var(--fg); font: 400 16px var(--font-mono);
  }

  @media (prefers-reduced-motion: reduce) {
    .now-line, .seat.acting, .oseat.acting, .pc.deal, .sdcards .pc { animation: none; }
    .verdict { animation: none; }
    .opt:not(:disabled):active { transform: none; }
  }
</style>

<main class="wrap">
  <header id="head">
    <h1>CariocAce <span>Replay</span></h1>
    <p class="sub">Colle une main. Elle se joue toute seule et s'arrête à chaque décision de Hero : à toi de deviner.</p>
  </header>

  <section id="view-input" class="stack">
    <label class="lab" for="hand-input">La main</label>
    <textarea id="hand-input" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Hero: BTN, Ah Qs&#10;Stack: 40bb&#10;Preflop: UTG fold, CO raise 2.2, Hero raise 6, ..."></textarea>
    <p id="sample-note" class="hint">Main d'exemple. Remplace-la en collant la tienne.</p>
    <p class="hint">Positions (UTG, CO, BTN, SB, BB…), cartes avec leur couleur (Ah Kd), tailles en bb.</p>
    <p id="err" class="err" role="alert" hidden></p>
    <div class="row">
      <button class="btn primary" data-do="run" type="button">Lancer la main</button>
      <button class="btn ghost" data-do="clear" type="button">Vider</button>
      <button class="btn ghost" data-do="sample" type="button">Exemple</button>
    </div>
  </section>

  <section id="view-owner" hidden></section>

  <section id="view-play" hidden>
    <div id="play" class="wrap" style="max-width:none"></div>
  </section>
</main>

<script>
/*CORE-START*/
const ORDER = ['UTG','UTG+1','UTG+2','MP','MP1','MP2','EP','LJ','HJ','CO','BTN','SB','BB','HERO'];
const PF = ['UTG','UTG+1','UTG+2','UTG+3','EP','MP','MP1','MP2','LJ','HJ','CO','BTN','SB','BB'];
const BASE_SEATS = {
  3: ['BTN','SB','BB'], 4: ['CO','BTN','SB','BB'], 5: ['UTG','CO','BTN','SB','BB'],
  6: ['UTG','HJ','CO','BTN','SB','BB'], 7: ['UTG','LJ','HJ','CO','BTN','SB','BB'],
  8: ['UTG','UTG+1','LJ','HJ','CO','BTN','SB','BB'], 9: ['UTG','UTG+1','UTG+2','LJ','HJ','CO','BTN','SB','BB']
};
const POS_NH  = String.raw`utg\s?\+\s?\d|utg|mp\s?\d?|ep|lj|hj|co|btn|bu|sb|bb`;
const POS_ALL = POS_NH + String.raw`|hero|h[eé]ros?`;
const ACT = String.raw`check[\s-]?raise|all[\s-]?in|[345][\s-]?bet|c[\s-]?bet|squeeze|shoves?|jam|push|tapis|limps?|isolate|iso|open|raises?|relance|bets?|mise|donk|probe|calls?|suit|folds?|couche|checks?|xr|[frcxb]`;
const CL_SRC  = String.raw`\b(${POS_ALL})\b(?:\s*\(\s*(?:h[eé]ros?|${POS_NH})\s*\))?[\s:\-–—,→>=]*(${ACT})(?![A-Za-z'’])(?:\s*(?:to\s+|à\s+)?(\d+(?:\.\d+)?(?:bb|x|%)?))?(\s*\(?\s*all[\s-]?in\s*\)?)?`;
const RUN_SRC = String.raw`(^|[^A-Za-z0-9])((?:(?:10|[2-9TJQKA])[cdhs]){1,5})(?![A-Za-z0-9])`;
const HDR_SRC = String.raw`(^|[^A-Za-z])(pr[eé][\s-]?flop|pf|flop|turn|river)(?=\s*(?:[:\-–—|\[(]|\n|$|(?:10|[2-9TJQKA])[cdhs]))\s*[:：\-–—|]?`;

const fmt = n => { const r = Math.round(n * 10) / 10; return String(Number.isInteger(r) ? r : r.toFixed(1)).replace('.', ','); };

function normText(t) {
  return t.replace(/\r/g, '').replace(/\uFE0F/g, '')
    .replace(/♠/g, 's').replace(/♥/g, 'h').replace(/♦/g, 'd').replace(/♣/g, 'c')
    .replace(/(\d),(\d)/g, '$1.$2');
}
function normPos(s) {
  s = s.toUpperCase().replace(/\s/g, '');
  if (s === 'BU') s = 'BTN';
  if (/^H[EÉ]ROS?$/.test(s)) s = 'HERO';
  return s;
}
function extractCards(t) {
  const out = []; const re = new RegExp(RUN_SRC, 'gi'); let m;
  while ((m = re.exec(t))) {
    const one = /(10|[2-9TJQKA])([cdhs])/gi; let c;
    while ((c = one.exec(m[2]))) out.push({ r: c[1] === '10' ? 'T' : c[1].toUpperCase(), s: c[2].toLowerCase() });
  }
  return out;
}
function kindOf(w) {
  w = w.toLowerCase().replace(/[\s-]/g, '');
  if (/^(fold|folds|couche|f)$/.test(w)) return 'fold';
  if (/^(check|checks|x)$/.test(w)) return 'check';
  if (/^(call|calls|suit|c|limp|limps)$/.test(w)) return 'call';
  if (/^(allin|jam|shove|shoves|push|tapis)$/.test(w)) return 'allin';
  if (/^(bet|bets|mise|cbet|donk|probe|b)$/.test(w)) return 'bet';
  return 'raise';
}
function clauses(t) {
  const re = new RegExp(CL_SRC, 'gi'), out = []; let m;
  while ((m = re.exec(t))) {
    const raw = m[3] || null; const o = { idx: m.index, pos: normPos(m[1]), kind: kindOf(m[2]) };
    if (raw) { const n = parseFloat(raw); if (/%$/.test(raw)) o.pct = n; else o.amt = n; }
    if (m[4] && ['bet', 'raise', 'allin'].includes(o.kind) && o.amt == null && o.pct == null) o.kind = 'allin';
    out.push(o);
  }
  return out;
}

function parseHand(raw) {
  let text = normText(raw || '').trim();
  if (!text) throw new Error("Colle une main d'abord.");
  const results = [], notes = [];
  text = text.split('\n').filter(line => {
    let m = line.match(/^\s*[-•*]?\s*(r[ée]sultat|results?|showdown|issue|outcome)\s*[:\-–]\s*(.+)$/i);
    if (m) { results.push(m[2].trim()); return false; }
    m = line.match(/^\s*[-•*]?\s*(notes?|comm?entaires?|remarques?|pourquoi|why|tags?|[ée]tiquettes?)\s*[:\-–]\s*(.*)$/i);

  const key = [...villain].reverse().find(x => x.kind !== 'fold') || villain[villain.length - 1];
  const big = key ? `<div class="now-line facing"><span class="who">${esc(key.pos)}</span><span class="what">${esc(descAct(key))}</span></div>` : '';
  const chips = acts.length > 1 ? `<div class="seats">${acts.map(x => `<span class="seat${x.hero ? ' me' : ''}"><b>${x.hero ? 'Hero' : esc(x.pos)}</b><em>${esc(descLog(x))}</em></span>`).join('')}</div>` : '';
  return `<div class="before"><span class="lab">Avant toi</span>${big}${chips}</div>`;
}

function decideHtml(st, toCall, log) {
  const g = phase === 'revealed' ? guesses[guesses.length - 1] : null;
  const o = toCall > 1e-9
    ? [['fold', 'Fold', ''], ['call', 'Call', fmt(toCall) + ' bb'], ['aggro', 'Raise', '']]
    : [['check', 'Check', ''], ['aggro', 'Bet', '']];
  let h = `<div class="panel decide">${beforeHtml(log)}<p class="q">Que fait Hero ?</p><div class="opts" style="--n:${o.length}">` +
    o.map(([v, l, s]) => {
      const sel = g ? g.guess === v : (v === 'aggro' && aggroOpen);
      return `<button class="opt${sel ? ' sel' : ''}" data-do="pick" data-v="${v}" type="button"${g ? ' disabled' : ''}>${l}${s ? `<small>${s}</small>` : ''}</button>`;
    }).join('') + `</div>`;

  if (!g && aggroOpen) {
    const so = sizeOptions(st).opts;
    h += `<div class="sizes"><span class="lab">Taille</span><div class="grid4">` +
      so.map(x => `<button class="opt sz" data-do="size" data-k="${x.key}" type="button">${esc(x.main)}${x.sub ? `<small>${esc(x.sub)}</small>` : ''}</button>`).join('') +
      `<button class="opt sz${customOpen ? ' sel' : ''}" data-do="custom" type="button">Autre<small>bb</small></button></div>` +
      (customOpen ? `<div class="custom"><input id="custom-size" type="text" inputmode="decimal" autocomplete="off" placeholder="Montant en bb"><button class="btn primary sm" data-do="custom-ok" type="button">Valider</button></div>` : '') +
      `</div>`;
  }
  if (g) {
    const same = g.guess === g.actual, ok = g.full;
    const tag = ok ? 'Même décision' : (same ? 'Même action, taille différente' : 'Décision différente');
    h += `<div class="verdict ${ok ? 'ok' : 'miss'}"><span class="tag ${ok ? 'ok' : 'miss'}">${tag}</span>
      <span class="big">Hero : ${esc(descAct(g.pre))}</span>`;
    if (g.guess === 'aggro' && g.spec) h += `<span class="muted">Toi : ${esc(g.verb)} ${esc(g.spec.text)}</span>`;
    h += `</div><button class="btn primary" data-do="next" type="button">Continuer</button>`;
  }
  return h + `</div>`;
}

function recapHtml(st, me) {
  const okN = guesses.filter(g => g.full).length, okA = guesses.filter(g => g.guess === g.actual).length;
  const sized = guesses.filter(g => g.sizeOk != null), okS = sized.filter(g => g.sizeOk).length;
  const alive = Object.keys(st.pl).filter(k => !st.pl[k].folded);
  const shown = (st.street === 'river' && !me.folded && alive.length >= 2) ? alive.filter(k => k !== H.heroPos && H.villains[k]) : [];
  const sd = shown.length ? `<div class="show"><span class="lab">Showdown</span>${shown.map(k => `<div class="sd"><span class="mono">${esc(k)}</span><div class="sdcards">${H.villains[k].map(c => cardHtml(c, 64)).join('')}</div></div>`).join('')}</div>` : '';
  return `<div class="panel decide">${sd}<div class="score">${okN} / ${guesses.length}<small>décisions identiques</small></div>
    ${sized.length ? `<p class="muted">Actions identiques : ${okA} / ${guesses.length} · Tailles identiques : ${okS} / ${sized.length}</p>` : ''}
    <div class="recap">${guesses.map(g => {
      const ok = g.full, same = g.guess === g.actual;
      return `<div><div class="top"><span class="lab">${STREET[g.street]}</span><span class="tag ${ok ? 'ok' : 'miss'}">${ok ? 'Identique' : (same ? 'Taille différente' : 'Différent')}</span></div>
        <span>Toi : ${esc(guessLabel(g))} · Hero : ${esc(descAct(g.pre))}</span></div>`;
    }).join('')}</div>
    ${H.results.length ? `<p class="muted">Résultat : ${esc(H.results.join(' · '))}</p>` : ''}
    ${GUEST_HAND ? '' : H.notes.map(n => `<p class="muted">${esc(n.label)} : ${esc(n.text)}</p>`).join('')}
    ${GUEST_HAND ? shareHtml() : ''}
    <div class="row"><button class="btn ${GUEST_HAND ? 'ghost' : 'primary'}" data-do="again" type="button">Rejouer cette main</button>${GUEST_HAND ? '' : '<button class="btn ghost" data-do="new" type="button">Nouvelle main</button>'}</div></div>`;
}

/* Mode invité : les réponses partent dans la base de la page (une fiche par personne) */
function shareText() {
  const okN = guesses.filter(g => g.full).length;
  return [GUEST_NAME ? `Réponse de ${GUEST_NAME}` : 'Ma réponse', ...guesses.map(g => `${STREET[g.street]} : ${guessLabel(g)} (Hero : ${descAct(g.pre)}) ${g.full ? '✓' : '✗'}`), `Score : ${okN} / ${guesses.length}`].join('\n');
}
function copyBlock() {
  const t = shareText();
  const canShare = typeof navigator !== 'undefined' && navigator && typeof navigator.share === 'function';
  return `<textarea id="share-text" readonly rows="${t.split('\n').length}">${esc(t)}</textarea>
    <div class="row">${canShare ? '<button class="btn primary" data-do="share" type="button">Envoyer</button>' : ''}<a class="btn ${canShare ? 'ghost' : 'primary'}" href="https://wa.me/?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">WhatsApp</a><button class="btn ghost" data-do="copy" type="button">Copier</button></div>`;
}
function shareHtml() {
  const who = GUEST_NAME ? ` ${esc(GUEST_NAME)}` : '';
  let inner;
  if (sendState === 'sending') inner = `<p class="hint">Envoi de tes réponses…</p>`;
  else if (sendState === 'sent') inner = `<span class="tag ok">Envoyé</span><p class="hint">Tes réponses sont bien arrivées. Merci${who} !</p>`;
  else if (sendState === 'exists') inner = `<span class="tag ok">Déjà envoyé</span><p class="hint">Tu avais déjà répondu à cette main : ta première réponse est conservée.</p>`;
  else if (sendState === 'fail') inner = `<p class="hint">L'envoi n'a pas marché. Réessaie, ou envoie ta réponse toi-même :</p><button class="btn ghost" data-do="retry" type="button">Réessayer l'envoi</button>${copyBlock()}`;
  else inner = `<p class="hint">Avec ton accès, l'envoi automatique n'est pas possible. Envoie ta réponse toi-même à celui qui t'a envoyé la main :</p>${copyBlock()}`;
  return `<div class="share"><span class="lab">Tes réponses</span>${inner}</div>`;
}
function ownerHtml(rows) {
  const when = iso => { try { return new Date(iso).toLocaleString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
  const items = rows.map(r => `<div class="ans"><div class="top"><span class="nm">${esc(r.name || '?')}</span><span class="tag ${r.total && r.score === r.total ? 'ok' : 'miss'}">${esc(r.score)} / ${esc(r.total)}</span></div>
    <span class="dt">${esc(when(r.at))}</span>
    <div class="seats">${(Array.isArray(r.steps) ? r.steps : []).map(x => `<span class="seat"><b>${esc(STREET[x.street] || x.street)} ${x.full ? '✓' : '✗'}</b><em>Toi : ${esc(x.guess)}</em><em>Hero : ${esc(x.hero)}</em></span>`).join('')}</div></div>`).join('');
  return `<div class="panel"><span class="lab">Réponses reçues · ${rows.length}</span>${items || '<p class="hint">Aucune réponse pour l\'instant.</p>'}</div>`;
}
function paintOwner() { const el = $('view-owner'); el.innerHTML = ownerHtml(ownerRows || []); el.hidden = !!H; }
async function ownerPanel() {
  try {
    const c = window.claude; if (!c || !c.use) return;
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user || !(await user.canEdit())) return;
    db.collection('answers').onSnapshot(snap => {
      ownerRows = snap.docs.map(d => d.data()).filter(Boolean).sort((a, b) => String(b.at || '').localeCompare(String(a.at || '')));
      paintOwner();
    }, () => {});
  } catch (e) {}
}
/* Version web : une notification ntfy par main terminée. Un seul envoi par navigateur et par main (la première réponse compte). */
async function sendViaNtfy() {
  let h = 0; for (const ch of GUEST_HAND) h = (h * 31 + ch.charCodeAt(0)) | 0;
  const key = 'cariocace-replay:sent:' + (h >>> 0).toString(36);
  try { if (localStorage.getItem(key)) return 'exists'; } catch (e) {}
  const okN = guesses.filter(g => g.full).length;
  const r = await fetch('https://ntfy.sh', {
    method: 'POST',
    body: JSON.stringify({
      topic: NTFY_TOPIC,
      title: `${GUEST_NAME} : ${okN} / ${guesses.length}`,
      message: shareText(),
      tags: ['spades']
    })
  });
  if (!r.ok) throw { code: 'http_' + r.status };
  try { localStorage.setItem(key, '1'); } catch (e) {}
  return 'sent';
}
async function sendAnswers() {
  if (sendState !== 'sending') return;
  const fin = st => { sendState = st; if (phase === 'done') render(); };
  const timeout = new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 15000));
  const job = NTFY_TOPIC ? sendViaNtfy() : (async () => {
    const c = window.claude;
    if (!c || !c.use) return 'nowrite';
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) return 'nowrite';
    if ((await user.can('data.write')) === false) return 'nowrite';
    const uid = await user.id();
    if (!uid) return 'nowrite';
    const ref = db.doc('answers/' + uid);
    if ((await ref.get()).exists) return 'exists';
    const okN = guesses.filter(g => g.full).length;
    await ref.set({
      name: GUEST_NAME, at: new Date().toISOString(), score: okN, total: guesses.length,
      steps: guesses.map(g => ({ street: g.street, guess: guessLabel(g), hero: descAct(g.pre), sameAction: g.guess === g.actual, full: !!g.full })),
      text: shareText()
    });
    return 'sent';
  })();
  try { fin(await Promise.race([job, timeout])); }
  catch (e) { fin(e && e.code === 'invalid_argument' ? 'nowrite' : 'fail'); }
}
async function shareOut(b) {
  try { await navigator.share({ text: shareText() }); }
  catch (e) { if (!e || e.name !== 'AbortError') copyShare(b); }
}
function copyShare(b) {
  const ta = $('share-text'); if (!ta) return;
  const old = b.textContent;
  const done = ok => { b.textContent = ok ? 'Copié' : 'Texte sélectionné : copie-le à la main'; setTimeout(() => { b.textContent = old; }, 2200); };
  ta.focus(); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  if (ok) { done(true); return; }
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).then(() => done(true), () => done(false)); return; } } catch (e) {}
  done(false);
}
const savedName = () => { try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; } };
function goGuest() {
  const inp = $('guest-name'), n = inp ? String(inp.value).trim().slice(0, 40) : '';
  if (!n) { const er = $('guest-err'); if (er) er.hidden = false; if (inp) inp.focus(); return; }
  GUEST_NAME = n; try { localStorage.setItem(NAME_KEY, n); } catch (e) {}
  H = GH; start();
}
function guestIntro() {
  const hp = GH.heroPos === 'HERO' ? '' : ` · ${esc(GH.heroPos)}`;
  $('head').querySelector('.sub').textContent = "Une main à deviner. Elle se joue toute seule et s'arrête à chaque décision de Hero : à toi de dire ce qu'il fait.";
  $('view-input').innerHTML = `<div class="panel intro"><span class="lab">Hero${hp} · ${fmt(GH.stack)} bb · ${GH.seats.length}-max</span>
    <div class="cards">${GH.heroCards.map(c => cardHtml(c, 56)).join('')}</div>
    <p class="hint">${GH.heroCount} décision${GH.heroCount > 1 ? 's' : ''} à deviner. Les cartes des adversaires restent cachées jusqu'au showdown.</p>
    <label class="lab" for="guest-name">Ton prénom</label>
    <div class="field"><input id="guest-name" type="text" maxlength="40" autocomplete="given-name" placeholder="Prénom" value="${esc(savedName())}"></div>
    <p id="guest-err" class="err" role="alert" hidden>Écris ton prénom pour commencer.</p>
    <p class="hint">Tes réponses seront envoyées à celui qui t'a envoyé la main.</p>
    <div class="row"><button class="btn primary" data-do="go" type="button">Commencer</button></div></div>`;
}

/* Table ovale : Hero en bas, les autres placés dans l'ordre du jeu autour */
function ovalHtml(st, acting, slots) {
  const seats = H.seats, n = seats.length;
  const hi = Math.max(0, seats.indexOf(H.heroPos));
  const tiles = seats.map((k, i) => {
    const th = (90 + ((i - hi + n) % n) * 360 / n) * Math.PI / 180;
    const cx = Math.cos(th), sy = Math.sin(th);
    const x = 50 + 41 * cx, y = 50 + 37 * sy;
    const dir = cx < 0.25 ? 'right' : 'left'; /* jeton de mise sur le côté du siège, vers le centre */
    const p = st.pl[k];
    const sub = p.folded ? 'fold' : (p.allin ? 'all-in' : fmt(p.stack - p.inv));
    const bet = (!p.folded && p.sb > 0) ? `<span class="bet">${fmt(p.sb)}</span>` : '';
    return `<div class="oseat dir-${dir}${p.folded ? ' out' : ''}${k === H.heroPos ? ' me' : ''}${k === acting ? ' acting' : ''}" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%"><b>${esc(k)}</b><em>${sub}</em>${bet}${k === 'BTN' ? '<i class="dbtn">D</i>' : ''}</div>`;
  }).join('');
  return `<div class="oval"><div class="ctr"><div class="board">${slots}</div><span class="info"><b>${STREET[st.street]}</b> · ${fmt(potOf(st))} bb</span></div>${tiles}</div>`;
}

function render() {
  $('view-input').hidden = !!H; $('view-play').hidden = !H; $('head').hidden = !!H;
  if (GUEST_HAND) $('view-owner').hidden = !!H || !ownerRows;
  if (!H) return;
  const { st, log } = rp(idx);
  const me = st.pl[H.heroPos];
  const toCall = Math.min(Math.max(0, st.cur - me.sb), me.stack - me.inv);
  const total = H.heroCount;
  const n = Math.min(guesses.length + (phase === 'revealed' ? 0 : 1), total);
  const heroName = H.heroPos === 'HERO' ? 'Hero' : `Hero · ${H.heroPos}`;
  const playing = phase === 'playing';
  const acting = (playing && lastEv && lastEv.t === 'act') ? lastEv.pos : null;
  const newFrom = (playing && lastEv && lastEv.t === 'street') ? st.board.length - lastEv.cards.length : 99;

  const slots = Array.from({ length: 5 }, (_, i) => st.board[i] ? cardHtml(st.board[i], 28, i >= newFrom ? 'deal' : '') : '<span class="slot"></span>').join('');
  const label = phase === 'done' ? 'Terminé' : playing ? 'En cours' : `Décision ${n} / ${total}`;

  let h = `<div class="bar">${GUEST_HAND ? '<span class="lab">Une main à deviner</span>' : '<button class="btn ghost sm" data-do="new" type="button">Nouvelle main</button>'}<span class="lab">${label}</span></div>`;
  h += `<div class="table">
    ${ovalHtml(st, acting, slots)}
    <div class="tbl-hero">
      <div class="hand">${H.heroCards.map(c => cardHtml(c, 46)).join('')}</div>
      <div class="who"><span class="lab">${esc(heroName)}</span><span class="mono">${fmt(me.stack - me.inv)} bb</span></div>
      <div class="tocall${toCall > 1e-9 && phase !== 'done' ? ' due' : ''}"><span class="lab">To call</span><span class="mono">${phase === 'done' ? '–' : fmt(toCall) + ' bb'}</span></div>
    </div>
  </div>`;

  if (playing) h += liveHtml(log);
  else if (phase === 'done') h += recapHtml(st, me);
  else h += decideHtml(st, toCall, log);

  h += `<div class="log">` + log.map(x => x.type === 'street'
    ? `<div class="lg-h"><span class="s">${STREET[x.street]}</span><span class="c">${x.cards.map(c => cardHtml(c, 26)).join('')}</span><span class="p mono">pot ${fmt(x.pot)}</span></div>`
    : `<div class="act${x.hero ? ' hero-act' : ''}"><span class="p">${x.hero ? 'Hero' : esc(x.pos)}</span><span class="mono">${esc(descLog(x))}</span></div>`
  ).join('') + `</div>`;
  if (H.hasEst) h += `<p class="note">~ : taille non précisée dans la main, estimée.</p>`;
  h += `<p class="note">Blinds 0,5 / 1${H.ante ? `, ante ${fmt(H.ante)}` : ''}. Hero part avec ${fmt(H.stack)} bb.</p>`;
  $('play').innerHTML = h;
  if (phase === 'ask' && aggroOpen) {
    const s = $('play').querySelector && $('play').querySelector('.sizes');
    if (s && s.scrollIntoView) { try { s.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {} }
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-do]'); if (!b || b.disabled) return;
  const d = b.dataset.do, ta = $('hand-input');
  if (d === 'run') run();
  else if (d === 'pick') pick(b.dataset.v);
  else if (d === 'size') pickSize(b.dataset.k);
  else if (d === 'custom') { customOpen = !customOpen; render(); if (customOpen) setTimeout(() => { const i = $('custom-size'); if (i) i.focus(); }, 0); }
  else if (d === 'custom-ok') customOk();
  else if (d === 'skip') skip();
  else if (d === 'next') next();
  else if (d === 'again') start();
  else if (d === 'go' && GH) goGuest();
  else if (d === 'retry' && GUEST_HAND) { sendState = 'sending'; render(); sendAnswers(); }
  else if (d === 'copy') copyShare(b);
  else if (d === 'share') shareOut(b);
  else if (d === 'new' && !GUEST_HAND) { clearTimeout(timer); H = null; render(); }
  else if (d === 'clear') { ta.value = ''; $('sample-note').hidden = true; $('err').hidden = true; ta.focus(); }
  else if (d === 'sample') { ta.value = SAMPLE; $('sample-note').hidden = false; $('err').hidden = true; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'custom-size') { e.preventDefault(); customOk(); }
  if (e.key === 'Enter' && e.target && e.target.id === 'guest-name') { e.preventDefault(); goGuest(); }
});

(function init() {
  if (GUEST_HAND) {
    try { GH = parseHand(GUEST_HAND); guestIntro(); ownerPanel(); }
    catch (err) { $('view-input').innerHTML = '<p class="err">Cette main ne peut pas être lue.</p>'; }
    return;
  }
  const ta = $('hand-input'), saved = load();
  ta.value = saved && saved.trim() ? saved : SAMPLE;
  $('sample-note').hidden = ta.value.trim() !== SAMPLE.trim();
  ta.addEventListener('input', () => { $('sample-note').hidden = ta.value.trim() !== SAMPLE.trim(); $('err').hidden = true; });
})();
</script>

</body>
</html>
